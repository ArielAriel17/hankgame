  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

<body>
  <div id="root"></div>

  <script type="text/babel">
const { useState, useEffect, useRef, useCallback, useContext, createContext, useMemo } = React;
const { motion, AnimatePresence } = Motion;
const { ChevronLeft, ChevronRight, Shuffle, Sparkles, HelpCircle } = LucideReact;

/* ═══════════════════════════════════════════════════════════════
0.  GOOGLE FONTS INJECTOR
/* ═══════════════════════════════════════════════════════════════ */
function Fonts() {
return (
<link
href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Nunito:wght@600;800;900&family=ZCOOL+KuaiLe&display=swap"
rel="stylesheet"

/* ═══════════════════════════════════════════════════════════════
1.  HANK CONTEXT  — global avatar state shared across screens
/* ═══════════════════════════════════════════════════════════════ */
const HankContext = createContext(null);
const DEFAULT_AVATAR = {
face: "round", skin: "peach",
eye: "round",  eyeColor: "obsidian",
hair: "mushroom", hairColor: "ink",
mouth: "smile", outfit: "overalls", accessory: "round-glasses",
};
function HankProvider({ children }) {
/* ── Core identity ── */
const [avatar,     setAvatar]     = useState(DEFAULT_AVATAR);
const [stage,      setStage]      = useState("welcome");
const [playerName, setPlayerName] = useState("小探險家");
/* ── Save system ── */
const [playerCode, setPlayerCode] = useState(null);
const [readEvents, setReadEvents] = useState([]); // ["regionId_year", ...]
const crownUnlocked = readEvents.length >= TOTAL_EVENTS && TOTAL_EVENTS > 0;
/* ── Toast notification ── */
const [toast, setToast] = useState(null); // { msg, type } or null
/* Mark an event as read and persist to cloud (fire-and-forget) */
const markEventRead = useCallback((regionId, year) => {
  const key = `${regionId}_${year}`;
  setReadEvents(prev => {
    if (prev.includes(key)) return prev;
    const next = [...prev, key];
    /* fire-and-forget — never blocks the UI */
    if (playerCode) dbSave(playerCode, playerName, avatar, next).catch(console.error);
    return next;
  });
}, [playerCode, playerName, avatar]);
/* Finish CharacterCreator — two modes:
   • Edit mode  (playerCode already exists): update avatar, keep readEvents, skip savecode
   • Create mode (no playerCode):            generate new code, clear readEvents, show savecode */
const finishCreation = useCallback(async (name, avatarData) => {
  setPlayerName(name);
  setAvatar(avatarData);
  if (playerCode) {
    // ── EDIT MODE: preserve code + progress ──
    await dbSave(playerCode, name, avatarData, readEvents);
    setToast({ msg: `頭像更新成功！歡迎回來，${name} 🐾`, type: "success" });
    setStage("map");
  } else {
    // ── CREATE MODE: generate unique code, save to cloud ──
    setIsLoading(true);
    try {
      const code = await dbGenCode();
      setPlayerCode(code);
      await dbSave(code, name, avatarData, []);
      setStage("savecode");
    } catch(e) {
      setToast({ msg: "儲存失敗，請檢查網路後再試！", type: "error" });
    } finally {
      setIsLoading(false);
    }
  }
}, [playerCode, readEvents]);
/* Load an existing save by code */
const loadSave = useCallback((profile) => {
  setPlayerCode(profile.code);
  setPlayerName(profile.name);
  setAvatar(profile.avatar);
  setReadEvents(profile.readEvents || []);
  setStage("map");
}, []);
/* ── Phase 3 guide / dialog state ── */
const [guideOpen,    setGuideOpen]    = useState(false);
const [guideRegion,  setGuideRegion]  = useState(null);
const [dialogPhase,  setDialogPhase]  = useState("idle");
const [dialogLines,  setDialogLines]  = useState([]);
const [yearQuery,    setYearQuery]    = useState("");
const [eventChoices, setEventChoices] = useState([]);
const [chosenEvent,  setChosenEvent]  = useState(null);
const [storyLines,   setStoryLines]   = useState([]);
const [isLoading,    setIsLoading]    = useState(false);
const openGuide = (region) => {
setGuideRegion(region);
setGuideOpen(true);
setDialogPhase("greeting");
setYearQuery("");
setEventChoices([]);
setChosenEvent(null);
setStoryLines([]);
setDialogLines([
`汪汪！你好，${playerName}！🐾`,
`歡迎來到「${region.name}」的時空探險！`,
"你想了解這裡在什麼年份發生的事呢？",
]);
};
const closeGuide = () => {
setGuideOpen(false);
setDialogPhase("idle");
setGuideRegion(null);
};
return (
<HankContext.Provider value={{
avatar, setAvatar, stage, setStage,
playerName, setPlayerName,
playerCode, setPlayerCode,
readEvents, setReadEvents, crownUnlocked,
markEventRead, finishCreation, loadSave,
toast, setToast,
guideOpen, guideRegion,
dialogPhase, setDialogPhase,
dialogLines, setDialogLines,
yearQuery, setYearQuery,
eventChoices, setEventChoices,
chosenEvent, setChosenEvent,
storyLines, setStoryLines,
isLoading, setIsLoading,
openGuide, closeGuide,
}}>
{children}
</HankContext.Provider>
);
}
/* ═══════════════════════════════════════════════════════════════
2.  AVATAR SYSTEM — palettes, parts, SVG assembly
/* ═══════════════════════════════════════════════════════════════ */
/* Fixed coordinate anchors — every part reads from here */
const A = {
faceCx:200, faceCy:215, faceRx:78, faceRy:92,
eyeLx:172, eyeRx:228, eyeY:205,
mouthCx:200, mouthCy:262,
hairTopCx:200, hairTopCy:145,
neckCx:200, neckTopY:295, neckBottomY:325,
bodyCx:200, bodyTopY:320,
};
const SKIN_TONES = [
{ id:"porcelain", label:"白皙", color:"#FCE3CB" },
{ id:"peach",     label:"蜜桃", color:"#F4C9A1" },
{ id:"tan",       label:"小麥", color:"#D9A77A" },
{ id:"bronze",    label:"古銅", color:"#B07A52" },
{ id:"sun",       label:"太陽", color:"#8C5A3A" },
];
const HAIR_COLORS = [
{ id:"ink",   label:"墨黑", color:"#1F1A17" },
{ id:"chest", label:"栗棕", color:"#5A3A24" },
{ id:"honey", label:"蜂蜜", color:"#C68B3F" },
{ id:"ember", label:"火紅", color:"#B7472A" },
{ id:"sky",   label:"天青", color:"#3F6B8A" },
];
const EYE_COLORS = [
{ id:"obsidian", label:"黑曜", color:"#241B14" },
{ id:"cocoa",    label:"可可", color:"#5B3A22" },
{ id:"amber",    label:"琥珀", color:"#B27522" },
{ id:"leaf",     label:"葉綠", color:"#3E7A4E" },
{ id:"lake",     label:"湖藍", color:"#2F6E8F" },
];
const skinColor  = id => SKIN_TONES.find(s=>s.id===id)?.color ?? "#F4C9A1";
const hairColor  = id => HAIR_COLORS.find(c=>c.id===id)?.color ?? "#1F1A17";
const eyeColor   = id => EYE_COLORS.find(c=>c.id===id)?.color  ?? "#241B14";
/* ── individual part renderers (same coordinate contract as Phase 1) ── */
function FaceBase({ shape, skin }) {
const { faceCx:cx, faceCy:cy } = A;
const fill = skinColor(skin);
const sk = "#3a2a1f";
const p = {
round:  `M ${cx-78} ${cy} a 78 88 0 1 0 156 0 a 78 88 0 1 0 -156 0`,
oval:   `M ${cx-72} ${cy} a 72 96 0 1 0 144 0 a 72 96 0 1 0 -144 0`,
square: `M ${cx-78} ${cy-80} Q ${cx-78} ${cy-90} ${cx-66} ${cy-90} L ${cx+66} ${cy-90} Q ${cx+78} ${cy-90} ${cx+78} ${cy-80} L ${cx+78} ${cy+60} Q ${cx+78} ${cy+90} ${cx+40} ${cy+92} L ${cx-40} ${cy+92} Q ${cx-78} ${cy+90} ${cx-78} ${cy+60} Z`,
heart:  `M ${cx} ${cy+92} C ${cx-90} ${cy+40} ${cx-86} ${cy-60} ${cx-50} ${cy-82} C ${cx-20} ${cy-96} ${cx} ${cy-78} ${cx} ${cy-66} C ${cx} ${cy-78} ${cx+20} ${cy-96} ${cx+50} ${cy-82} C ${cx+86} ${cy-60} ${cx+90} ${cy+40} ${cx} ${cy+92} Z`,
long:   `M ${cx-66} ${cy} a 66 102 0 1 0 132 0 a 66 102 0 1 0 -132 0`,
}[shape] ?? `M ${cx-78} ${cy} a 78 88 0 1 0 156 0 a 78 88 0 1 0 -156 0`;
return (
<>
<ellipse cx={cx-78} cy={cy+5} rx="10" ry="16" fill={fill} stroke={sk} strokeWidth="3"/>
<ellipse cx={cx+78} cy={cy+5} rx="10" ry="16" fill={fill} stroke={sk} strokeWidth="3"/>
<path d={p} fill={fill} stroke={sk} strokeWidth="3.5" strokeLinejoin="round"/>
<ellipse cx={cx-44} cy={cy+22} rx="14" ry="8" fill="#F08989" opacity="0.45"/>
<ellipse cx={cx+44} cy={cy+22} rx="14" ry="8" fill="#F08989" opacity="0.45"/>
</>
);
}
function Eyes({ shape, color }) {
const { eyeLx:lx, eyeRx:rx, eyeY:y } = A;
const iris = eyeColor(color);
const sk = "#1a1410";
const eye = (cx, mirror=false) => {
switch(shape) {
case "almond": return <g key={cx}><path d={`M${cx-13} ${y} Q${cx} ${y-10} ${cx+13} ${y} Q${cx} ${y+10} ${cx-13} ${y} Z`} fill="#fff" stroke={sk} strokeWidth="2.5"/><ellipse cx={cx} cy={y+1} rx="6" ry="7" fill={iris}/><circle cx={cx-1.5} cy={y-2} r="2" fill="#fff"/></g>;
case "sparkle": return <g key={cx}><ellipse cx={cx} cy={y} rx="12" ry="13" fill="#fff" stroke={sk} strokeWidth="2.5"/><circle cx={cx} cy={y+1} r="8" fill={iris}/><circle cx={cx-3} cy={y-3} r="2.6" fill="#fff"/><circle cx={cx+4} cy={y+4} r="1.4" fill="#fff"/></g>;
case "wink": return mirror
? <g key={cx}><path d={`M${cx-12} ${y} Q${cx} ${y+4} ${cx+12} ${y}`} stroke={sk} strokeWidth="3.5" fill="none" strokeLinecap="round"/></g>
: <g key={cx}><ellipse cx={cx} cy={y} rx="11" ry="13" fill="#fff" stroke={sk} strokeWidth="2.5"/><circle cx={cx} cy={y+1} r="7" fill={iris}/><circle cx={cx-2} cy={y-2} r="2.4" fill="#fff"/></g>;
case "cheeky": return <g key={cx}><path d={`M${cx-12} ${y+2} Q${cx} ${y-8} ${cx+12} ${y+2}`} stroke={sk} strokeWidth="3" fill="none" strokeLinecap="round"/><path d={`M${cx-12} ${y+2} Q${cx} ${y+10} ${cx+12} ${y+2}`} stroke={sk} strokeWidth="2.5" fill="#fff"/><circle cx={cx} cy={y+3} r="4" fill={iris}/></g>;
default: return <g key={cx}><ellipse cx={cx} cy={y} rx="11" ry="13" fill="#fff" stroke={sk} strokeWidth="2.5"/><circle cx={cx} cy={y+1} r="7" fill={iris}/><circle cx={cx-2} cy={y-2} r="2.4" fill="#fff"/></g>;
}
};
return (
<>
{eye(lx,false)}{eye(rx,true)}
<path d={`M${lx-13} ${y-18} Q${lx} ${y-24} ${lx+13} ${y-18}`} stroke="#2a1d14" strokeWidth="3.5" fill="none" strokeLinecap="round"/>
<path d={`M${rx-13} ${y-18} Q${rx} ${y-24} ${rx+13} ${y-18}`} stroke="#2a1d14" strokeWidth="3.5" fill="none" strokeLinecap="round"/>
</>
);
}
function Mouth({ shape }) {
const {mouthCx:cx,mouthCy:cy} = A;
const sk="#2a1410";
switch(shape){
case "grin":   return <g><path d={`M${cx-22} ${cy-2} Q${cx} ${cy+18} ${cx+22} ${cy-2} Q${cx} ${cy+4} ${cx-22} ${cy-2} Z`} fill="#3a1a14" stroke={sk} strokeWidth="3"/><rect x={cx-12} y={cy-1} width="24" height="6" fill="#fff" rx="1"/></g>;
case "tongue": return <g><path d={`M${cx-18} ${cy-2} Q${cx} ${cy+10} ${cx+18} ${cy-2}`} stroke={sk} strokeWidth="3" fill="#3a1a14"/><ellipse cx={cx+4} cy={cy+8} rx="8" ry="6" fill="#F47A8A" stroke={sk} strokeWidth="2"/></g>;
case "smirk":  return <path d={`M${cx-14} ${cy+2} Q${cx-2} ${cy+8} ${cx+16} ${cy-4}`} stroke={sk} strokeWidth="3.5" fill="none" strokeLinecap="round"/>;
case "ohh":    return <ellipse cx={cx} cy={cy+2} rx="7" ry="9" fill="#3a1a14" stroke={sk} strokeWidth="2.5"/>;
default:       return <path d={`M${cx-16} ${cy} Q${cx} ${cy+12} ${cx+16} ${cy}`} stroke={sk} strokeWidth="3.5" fill="none" strokeLinecap="round"/>;
}
}
function Hair({ style, color }) {
const {hairTopCx:cx,hairTopCy:cy,faceCx:fcx,faceCy:fcy} = A;
const fill = hairColor(color); const sk="#150f0a";
switch(style){
case "spike":  return <path d={`M${fcx-78} ${fcy-40} L${fcx-60} ${cy-58} L${fcx-40} ${cy-40} L${fcx-20} ${cy-66} L${fcx} ${cy-44} L${fcx+20} ${cy-70} L${fcx+40} ${cy-42} L${fcx+60} ${cy-60} L${fcx+78} ${fcy-40} Q${fcx+72} ${fcy-58} ${fcx} ${fcy-72} Q${fcx-72} ${fcy-58} ${fcx-78} ${fcy-40} Z`} fill={fill} stroke={sk} strokeWidth="3" strokeLinejoin="round"/>;
case "side":   return <g><path d={`M${fcx-78} ${fcy-30} Q${fcx-88} ${cy-30} ${fcx-50} ${cy-58} Q${fcx} ${cy-72} ${fcx+58} ${cy-50} Q${fcx+86} ${cy-30} ${fcx+78} ${fcy-30} Q${fcx+72} ${fcy-58} ${fcx} ${fcy-72} Q${fcx-72} ${fcy-58} ${fcx-78} ${fcy-30} Z`} fill={fill} stroke={sk} strokeWidth="3"/><path d={`M${fcx-50} ${fcy-60} Q${fcx-30} ${fcy-30} ${fcx+30} ${fcy-44} Q${fcx+50} ${fcy-50} ${fcx+58} ${fcy-66} Q${fcx+10} ${fcy-78} ${fcx-50} ${fcy-60} Z`} fill={fill} stroke={sk} strokeWidth="2.5"/></g>;
case "curly":  return <g>{[[fcx-60,fcy-50],[fcx-32,fcy-66],[fcx,fcy-72],[fcx+32,fcy-66],[fcx+60,fcy-50],[fcx-72,fcy-30],[fcx+72,fcy-30],[fcx-46,fcy-60],[fcx+46,fcy-60]].map(([x,y],i)=><circle key={i} cx={x} cy={y} r="20" fill={fill} stroke={sk} strokeWidth="2.5"/>)}</g>;
case "cap-hair": return <g><path d={`M${fcx-56} ${fcy-48} Q${fcx-30} ${fcy-32} ${fcx} ${fcy-44} Q${fcx+30} ${fcy-32} ${fcx+56} ${fcy-48} Q${fcx+30} ${fcy-58} ${fcx} ${fcy-54} Q${fcx-30} ${fcy-58} ${fcx-56} ${fcy-48} Z`} fill={fill} stroke={sk} strokeWidth="2.5"/><path d={`M${fcx-72} ${fcy-48} Q${fcx-78} ${cy-30} ${fcx-50} ${cy-58} Q${fcx} ${cy-72} ${fcx+50} ${cy-58} Q${fcx+78} ${cy-30} ${fcx+72} ${fcy-48} Z`} fill="#C44C3D" stroke={sk} strokeWidth="3"/><path d={`M${fcx+10} ${fcy-50} Q${fcx+72} ${fcy-44} ${fcx+92} ${fcy-30} Q${fcx+72} ${fcy-36} ${fcx+10} ${fcy-40} Z`} fill="#9E3A2C" stroke={sk} strokeWidth="2.5"/><circle cx={cx} cy={cy-58} r="5" fill="#F2D27A" stroke={sk} strokeWidth="2"/></g>;
default:       return <path d={`M${fcx-82} ${fcy-30} Q${fcx-92} ${cy-40} ${fcx-60} ${cy-50} Q${fcx} ${cy-78} ${fcx+60} ${cy-50} Q${fcx+92} ${cy-40} ${fcx+82} ${fcy-30} Q${fcx+72} ${fcy-58} ${fcx} ${fcy-72} Q${fcx-72} ${fcy-58} ${fcx-82} ${fcy-30} Z`} fill={fill} stroke={sk} strokeWidth="3" strokeLinejoin="round"/>;
}
}
function Outfit({ outfit }) {
const {bodyCx:cx,bodyTopY:y} = A; const sk="#2a1d14";
const Torso = ({fill}) => <path d={`M${cx-90} ${y+8} Q${cx-100} ${y+30} ${cx-100} ${y+80} L${cx+100} ${y+80} Q${cx+100} ${y+30} ${cx+90} ${y+8} Q${cx+50} ${y-2} ${cx} ${y-2} Q${cx-50} ${y-2} ${cx-90} ${y+8} Z`} fill={fill} stroke={sk} strokeWidth="3" strokeLinejoin="round"/>;
switch(outfit){
case "tracksuit": return <g><Torso fill="#C44C3D"/><path d={`M${cx-90} ${y+8} L${cx-100} ${y+80}`} stroke="#F5EFE3" strokeWidth="6" fill="none"/><path d={`M${cx+90} ${y+8} L${cx+100} ${y+80}`} stroke="#F5EFE3" strokeWidth="6" fill="none"/><line x1={cx} y1={y-2} x2={cx} y2={y+78} stroke="#F5EFE3" strokeWidth="2.5"/></g>;
case "explorer":  return <g><Torso fill="#A07246"/><rect x={cx-58} y={y+30} width="28" height="28" fill="none" stroke={sk} strokeWidth="2.5"/><rect x={cx+30} y={y+30} width="28" height="28" fill="none" stroke={sk} strokeWidth="2.5"/></g>;
case "sailor":    return <g><Torso fill="#F5EFE3"/><path d={`M${cx-46} ${y-2} L${cx-66} ${y+50} L${cx} ${y+30} L${cx+66} ${y+50} L${cx+46} ${y-2} L${cx} ${y+18} Z`} fill="#2A4A6E" stroke={sk} strokeWidth="2.5" strokeLinejoin="round"/></g>;
case "tee":       return <g><Torso fill="#E8A93C"/><rect x={cx-60} y={y+38} width="120" height="10" fill="#2A4A6E"/></g>;
default:          return <g><Torso fill="#F5EFE3"/><path d={`M${cx-60} ${y+10} L${cx-72} ${y+80} L${cx+72} ${y+80} L${cx+60} ${y+10} L${cx+30} ${y+6} L${cx+30} ${y+22} L${cx-30} ${y+22} L${cx-30} ${y+6} Z`} fill="#3F6B8A" stroke={sk} strokeWidth="2.5" strokeLinejoin="round"/><rect x={cx-32} y={y-4} width="10" height="20" fill="#3F6B8A" stroke={sk} strokeWidth="2"/><rect x={cx+22} y={y-4} width="10" height="20" fill="#3F6B8A" stroke={sk} strokeWidth="2"/></g>;
}
}
function Accessory({ kind }) {
const {eyeLx:lx,eyeRx:rx,eyeY:y,faceCx,faceCy,hairTopCx:hx,hairTopCy:hy} = A;
const sk="#1a1410";
switch(kind){
case "round-glasses": return <g><circle cx={lx} cy={y} r="18" fill="none" stroke={sk} strokeWidth="3"/><circle cx={rx} cy={y} r="18" fill="none" stroke={sk} strokeWidth="3"/><line x1={lx+18} y1={y} x2={rx-18} y2={y} stroke={sk} strokeWidth="3"/></g>;
case "goggles":   return <g><rect x={faceCx-90} y={y-6} width="180" height="10" fill="#3a2a1f" stroke={sk} strokeWidth="2"/><ellipse cx={lx} cy={y} rx="20" ry="16" fill="#A8D8E8" stroke={sk} strokeWidth="3"/><ellipse cx={rx} cy={y} rx="20" ry="16" fill="#A8D8E8" stroke={sk} strokeWidth="3"/></g>;
case "map-hat":   return <g><rect x={hx-26} y={hy-78} width="52" height="14" rx="3" fill="#F2E2C2" stroke={sk} strokeWidth="2.5"/><circle cx={hx-26} cy={hy-71} r="4" fill="#C44C3D" stroke={sk} strokeWidth="2"/><circle cx={hx+26} cy={hy-71} r="4" fill="#C44C3D" stroke={sk} strokeWidth="2"/></g>;
case "bandana":   return <g><path d={`M${faceCx-82} ${faceCy-58} Q${faceCx} ${faceCy-78} ${faceCx+82} ${faceCy-58} L${faceCx+78} ${faceCy-44} Q${faceCx} ${faceCy-58} ${faceCx-78} ${faceCy-44} Z`} fill="#C44C3D" stroke={sk} strokeWidth="2.5" strokeLinejoin="round"/></g>;
default: return null;
}
}
function Neck({ skin }) {
const {neckCx:cx,neckTopY:y0,neckBottomY:y1} = A;
const fill = skinColor(skin);
return <g><path d={`M${cx-18} ${y0} L${cx-22} ${y1} L${cx+22} ${y1} L${cx+18} ${y0} Z`} fill={fill} stroke="#3a2a1f" strokeWidth="3" strokeLinejoin="round"/></g>;
}
/* Full avatar SVG — single <g>, strict z-order */
function AvatarSVG({ avatar: av, size=320 }) {
return (
<svg viewBox="0 0 400 400" width={size} height={size}>
<defs>
<radialGradient id={`halo-${size}`} cx="50%" cy="40%" r="60%">
<stop offset="0%" stopColor="#FFF1D6"/>
<stop offset="100%" stopColor="#F2D9A8" stopOpacity="0"/>
</radialGradient>
</defs>
<circle cx="200" cy="200" r="190" fill={`url(#halo-${size})`}/>
<g>
<Outfit outfit={av.outfit}/>
<Neck skin={av.skin}/>
<FaceBase shape={av.face} skin={av.skin}/>
<Eyes shape={av.eye} color={av.eyeColor}/>
<Mouth shape={av.mouth}/>
<Hair style={av.hair} color={av.hairColor}/>
<Accessory kind={av.accessory}/>
</g>
</svg>
);
}
/* ═══════════════════════════════════════════════════════════════
3.  PHASE 1: CHARACTER CREATOR
/* ═══════════════════════════════════════════════════════════════ */
const FACE_SHAPES  = ["round","oval","square","heart","long"];
const EYE_SHAPES   = ["round","almond","sparkle","wink","cheeky"];

/* ═══════════════════════════════════════════════════════════════
   AUDIO SYSTEM — Pure Web Audio API synthesis (no external files)
   Animal Crossing style: looping BGM melody + wooden tap click +
   pentatonic typewriter blips for the dog dialogue.
   ─────────────────────────────────────────────────────────────
   HOW TO REPLACE WITH REAL AUDIO FILES (optional upgrade):
     BGM:   drop an .mp3 into the same folder as HankGame.html,
            then inside startBGM() use:
              const audio = new Audio('./your-bgm.mp3');
              audio.loop = true; audio.volume = 0.22; audio.play();
     SFX:   same pattern with a short .wav/.mp3 in playClick().
   ─────────────────────────────────────────────────────────────
/* ═══════════════════════════════════════════════════════════════ */
const AudioSystem = (() => {
  let _ctx=null,_master=null,_bgmGain=null,_sfxGain=null;
  let _muted=false,_bgmRunning=false,_bgmTimeout=null;
  let _blipIdx=0,_lastBlip=0;

  const getCtx=()=>{
    if(!_ctx){
      _ctx=new(window.AudioContext||window.webkitAudioContext)();
      _master=_ctx.createGain(); _master.gain.value=1; _master.connect(_ctx.destination);
      _bgmGain=_ctx.createGain(); _bgmGain.gain.value=0.19; _bgmGain.connect(_master);
      _sfxGain=_ctx.createGain(); _sfxGain.gain.value=0.46; _sfxGain.connect(_master);
    }
    if(_ctx.state==='suspended') _ctx.resume();
    return _ctx;
  };

  /* primitive: schedule one oscillator burst */
  const tone=(freq,dur,amp,type,dest)=>{
    try{
      const c=getCtx();
      const osc=c.createOscillator(),g=c.createGain();
      osc.type=type||'sine'; osc.frequency.setValueAtTime(freq,c.currentTime);
      g.gain.setValueAtTime(0,c.currentTime);
      g.gain.linearRampToValueAtTime(amp,c.currentTime+0.009);
      g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+dur);
      osc.connect(g); g.connect(dest||_sfxGain);
      osc.start(c.currentTime); osc.stop(c.currentTime+dur+0.01);
    }catch(e){}
  };

  /* ── Wooden-tap click sound ── */
  const playClick=()=>{
    if(_muted) return;
    try{ getCtx(); } catch(e){ return; }
    tone(700,0.07,0.55,'triangle');
    tone(370,0.05,0.18,'sine');
  };

  /* ── Typewriter blips (AC pentatonic character speech) ── */
  const PEN=[261.63,293.66,329.63,392.00,440.00,523.25,587.33,659.25,783.99,880.00];
  const playBlip=()=>{
    if(_muted) return;
    const now=Date.now(); if(now-_lastBlip<52) return; _lastBlip=now;
    try{ getCtx(); } catch(e){ return; }
    const f=PEN[_blipIdx%PEN.length]*(0.96+Math.random()*0.08); _blipIdx++;
    tone(f,0.062,0.17,'sine');
  };

  /* ── BGM: looping Animal Crossing-style melody in C major ── */
  /* [freq_hz, beats]  0=rest   tempo: 112 BPM = 0.536s/beat */
  const MELODY=[
    [523.25,1],[0,.25],[659.25,.75],[587.33,.5],[523.25,1],[392.00,1],
    [440.00,.5],[493.88,.5],[523.25,1.5],[587.33,.5],[659.25,.5],[698.46,.5],
    [659.25,1],[587.33,.5],[523.25,.5],[493.88,.5],[440.00,2],[0,.5],
    [392.00,.5],[440.00,.5],[493.88,.5],[523.25,.5],[587.33,1],
    [523.25,.5],[493.88,.5],[440.00,1],[392.00,.5],[329.63,.5],
    [392.00,.5],[440.00,.5],[493.88,.5],[523.25,1.5],[493.88,.5],
    [440.00,.5],[392.00,.5],[329.63,.5],[261.63,2],[0,1],
  ];
  const BPS=112/60;

  const _loopBGM=()=>{
    if(!_bgmRunning) return;
    try{
      const c=getCtx(); let t=c.currentTime+0.06; let total=0;
      for(const [freq,beats] of MELODY){
        const dur=beats/BPS;
        if(freq>0){
          /* melody — triangle for warm AC feel */
          const o1=c.createOscillator(),g1=c.createGain();
          o1.type='triangle'; o1.frequency.setValueAtTime(freq,t);
          g1.gain.setValueAtTime(0,t);
          g1.gain.linearRampToValueAtTime(0.48,t+0.028);
          g1.gain.exponentialRampToValueAtTime(0.0001,t+dur*0.86);
          o1.connect(g1); g1.connect(_bgmGain); o1.start(t); o1.stop(t+dur);
          /* octave-up shimmer at lower volume */
          const o2=c.createOscillator(),g2=c.createGain();
          o2.type='sine'; o2.frequency.setValueAtTime(freq*2,t);
          g2.gain.setValueAtTime(0,t);
          g2.gain.linearRampToValueAtTime(0.10,t+0.02);
          g2.gain.exponentialRampToValueAtTime(0.0001,t+dur*0.68);
          o2.connect(g2); g2.connect(_bgmGain); o2.start(t); o2.stop(t+dur);
          /* soft bass on every other note */
          if(Math.random()>0.45){
            const o3=c.createOscillator(),g3=c.createGain();
            o3.type='sine'; o3.frequency.setValueAtTime(freq*0.5,t);
            g3.gain.setValueAtTime(0,t);
            g3.gain.linearRampToValueAtTime(0.22,t+0.04);
            g3.gain.exponentialRampToValueAtTime(0.0001,t+dur*0.6);
            o3.connect(g3); g3.connect(_bgmGain); o3.start(t); o3.stop(t+dur);
          }
        }
        t+=dur; total+=dur;
      }
      _bgmTimeout=setTimeout(_loopBGM,(total-0.25)*1000);
    }catch(e){}
  };

  const startBGM=()=>{ if(_bgmRunning) return; _bgmRunning=true; _loopBGM(); };
  const stopBGM=()=>{ _bgmRunning=false; if(_bgmTimeout){clearTimeout(_bgmTimeout);_bgmTimeout=null;} };
  const toggleMute=()=>{
    _muted=!_muted;
    try{ getCtx(); _master.gain.setTargetAtTime(_muted?0:1,_ctx.currentTime,0.06); }catch(e){}
    return _muted;
  };
  const isMuted=()=>_muted;
  return { playClick, playBlip, startBGM, stopBGM, toggleMute, isMuted };
})();
/* ── MuteButton — floating audio toggle (bottom-right) ── */
function MuteButton() {
  const [muted, setMuted] = useState(false);
  return (
    <motion.button
      onClick={()=>{ const m=AudioSystem.toggleMute(); setMuted(m); }}
      whileTap={{scale:.85}} whileHover={{scale:1.12}}
      title={muted?"恢復音效":"靜音"}
      className="absolute bottom-5 right-5 pointer-events-auto z-30
        w-10 h-10 rounded-full border-[2.5px] border-[#3A2010]
        bg-[#FFF7E0] shadow-[3px_3px_0_#3A2010]
        flex items-center justify-center
        hover:bg-[#F0D9A0] transition-colors select-none"
      style={{fontSize:18,lineHeight:1}}>
      {muted?"🔇":"🔊"}
    </motion.button>
  );
}

/* ═══════════════════════════════════════════════════════════════
7.  MAP VIEWPORT — cursor-centered zoom + free pan
/* ═══════════════════════════════════════════════════════════════ */
function MapViewport({ children, zoom, onZoomChange, pan, onPanChange, onNodeClick }) {
const containerRef = useRef(null);
const isDragging   = useRef(false);
const dragStart    = useRef({ x:0, y:0, px:0, py:0 });
const didMove      = useRef(false);
/* ── wheel zoom centred on cursor ── */
const handleWheel = useCallback(e => {
e.preventDefault();
const rect = containerRef.current.getBoundingClientRect();
const mouseX = e.clientX - rect.left;
const mouseY = e.clientY - rect.top;
const factor = e.deltaY < 0 ? 1.12 : 1/1.12;
onZoomChange(prev => {
const next = Math.min(6, Math.max(0.8, prev * factor));
/* shift pan so the point under cursor stays fixed:
pan' = mouse - (mouse - pan) * (next/prev)   */
const ratio = next / prev;
onPanChange(pp => ({
x: mouseX - (mouseX - pp.x) * ratio,
y: mouseY - (mouseY - pp.y) * ratio,
}));
return next;
});
}, [onZoomChange, onPanChange]);
useEffect(()=>{
const el = containerRef.current;
if(!el) return;
el.addEventListener("wheel", handleWheel, { passive:false });
return ()=>el.removeEventListener("wheel", handleWheel);
},[handleWheel]);
/* ── mouse drag pan ── */
const onMouseDown = e => {
if(e.button!==0) return;
isDragging.current = true;
didMove.current    = false;
dragStart.current  = { x:e.clientX, y:e.clientY, px:pan.x, py:pan.y };
};
const onMouseMove = e => {
if(!isDragging.current) return;
const dx = e.clientX - dragStart.current.x;
const dy = e.clientY - dragStart.current.y;
if(Math.abs(dx)+Math.abs(dy)>3) didMove.current = true;
onPanChange({ x:dragStart.current.px+dx, y:dragStart.current.py+dy });
};
const onMouseUp = () => { isDragging.current = false; };
/* ── touch: single-finger pan + two-finger pinch zoom ── */
const lastTouches = useRef(null);
const onTouchStart = e => {
lastTouches.current = [...e.touches].map(t=>({id:t.identifier,x:t.clientX,y:t.clientY}));
};
const onTouchMove = e => {
e.preventDefault();
const cur = [...e.touches].map(t=>({id:t.identifier,x:t.clientX,y:t.clientY}));
const prev = lastTouches.current;
if(!prev) return;
if(cur.length===1 && prev.length===1) {
const dx=cur[0].x-prev[0].x, dy=cur[0].y-prev[0].y;
onPanChange(pp=>({x:pp.x+dx,y:pp.y+dy}));
} else if(cur.length===2 && prev.length===2) {
const dist  = (a,b)=>Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
const dCur  = dist(cur,cur);  // distance between fingers now
const dPrev = dist(prev,prev);
if(dPrev===0) return;
const factor = dCur/dPrev;
const mx = (cur[0].x+cur[1].x)/2;
const my = (cur[0].y+cur[1].y)/2;
const rect = containerRef.current.getBoundingClientRect();
const px = mx-rect.left, py=my-rect.top;
onZoomChange(z=>{
const next=Math.min(6,Math.max(0.8,z*factor));
const ratio=next/z;
onPanChange(pp=>({x:px-(px-pp.x)*ratio,y:py-(py-pp.y)*ratio}));
return next;
});
}
lastTouches.current = cur;
};
const onTouchEnd = e => { lastTouches.current = [...e.touches].map(t=>({id:t.identifier,x:t.clientX,y:t.clientY})); };
return (
<div
ref={containerRef}
className="absolute inset-0 overflow-hidden"
style={{ cursor: isDragging.current ? "grabbing":"grab", touchAction:"none" }}
onMouseDown={onMouseDown}
onMouseMove={onMouseMove}
onMouseUp={onMouseUp}
onMouseLeave={onMouseUp}
onTouchStart={onTouchStart}
onTouchMove={onTouchMove}
onTouchEnd={onTouchEnd}
>
{/* The single transform layer — no spring here; direct transform for responsiveness */}
<div
style={{
position:"absolute", left:0, top:0, width:"100%", height:"100%",
transform:`translate(${pan.x}px,${pan.y}px) scale(${zoom})`,
transformOrigin:"0 0",
willChange:"transform",
transition: isDragging.current ? "none" : "transform 0.05s linear",
}}
>
{children}
</div>
</div>
);
}

/* ═══════════════════════════════════════════════════════════════ */
/* Per-region label offsets for dense clusters (Taiwan, Japan, Korea).
   dx = horizontal shift from dot centre; dy = additional vertical shift.
   Negative dy moves label HIGHER (further above dot). */
const LABEL_OFFSETS = {
/* Taiwan cluster — spread around the narrow island */
taipei:    { dx:  0, dy: -1 }, keelung:   { dx: 10, dy:  0 },
yilan:     { dx: 12, dy:  2 }, hualien:   { dx: 12, dy:  0 },
taitung:   { dx: 12, dy:  3 }, kaohsiung: { dx:-11, dy:  3 },
tainan:    { dx:-11, dy:  1 }, pingtung:  { dx: 12, dy:  5 },
nantou:    { dx:-11, dy:  0 }, taichung:  { dx:-11, dy: -2 },
hsinchu:   { dx: -9, dy: -3 }, penghu:    { dx: -9, dy:  0 },
/* Japan Kansai / Chugoku cluster */
kyoto:     { dx: -9, dy: -1 }, osaka:     { dx: 10, dy:  1 },
nara:      { dx: 10, dy:  4 }, hiroshima: { dx: -9, dy:  0 },
fukuoka:   { dx: -9, dy: -2 }, nagoya:    { dx: 10, dy: -2 },
kanazawa:  { dx: -9, dy:  0 }, kagoshima: { dx: -9, dy:  3 },
/* Korea cluster */
incheon:   { dx:-11, dy:  0 }, seoul:     { dx:  0, dy: -2 },
chuncheon: { dx: 10, dy:  0 }, wonsan:    { dx: 11, dy:  0 },
daegu:     { dx: 10, dy:  2 }, gyeongju:  { dx: 11, dy:  4 },
gwangju:   { dx:-11, dy:  2 }, busan:     { dx: 10, dy:  2 },
hamhung:   { dx: 10, dy:  0 }, pyongyang: { dx: -9, dy: -2 },
/* China Yangtze cluster */
nanjing:   { dx: 10, dy:  0 }, hangzhou:  { dx: 10, dy:  4 },
fuzhou:    { dx: 10, dy:  0 }, wuhan:     { dx: 10, dy:  0 },
chengdu:   { dx: -9, dy:  0 }, chongqing: { dx: -9, dy:  4 },
shanghai:  { dx: 12, dy:  0 }, guangzhou: { dx: -9, dy:  3 },
};
function MapNode({ region, zoom, isActive, onClick, onHover, onLeave }) {
const pal  = COUNTRY_PALETTE[region.country] ?? COUNTRY_PALETTE.china;
const tier = NODE_TIER(region);
// Separate thresholds: dot appears first, label appears later
const dotThresh   = tier===1 ? 1.4 : tier===2 ? 2.0 : 2.8;
const labelThresh = tier===1 ? 1.9 : tier===2 ? 2.5 : 3.2;
const dotOpacity   = Math.min(1, Math.max(0, (zoom - dotThresh)   / 0.3));
const labelOpacity = Math.min(1, Math.max(0, (zoom - labelThresh) / 0.3));
if (dotOpacity <= 0.01) return null;
const { x, y } = region;
// Dot radius in SVG units — small enough to never overlap adjacent cities
const r = tier===1 ? 3 : tier===2 ? 2.5 : 2;
// Label offset — use collision table for dense regions, default to above-dot
const off = LABEL_OFFSETS[region.id] ?? { dx: 0, dy: 0 };
const labelX = x + off.dx;
const labelY = y - r - 5 + off.dy;
// Colour: all dots are the classic coral-red from reference image
const dotFill   = "#D94535";
const dotStroke = "#8B1A0A";
return (
<g
style={{ opacity: dotOpacity, cursor: "pointer" }}
onClick={e => { e.stopPropagation(); AudioSystem.playClick(); onClick(region); }}
onMouseEnter={e => onHover(region, e)}
onMouseLeave={onLeave}
>
{/* Subtle breathing halo — only tier-1, stays small */}
{tier === 1 && (
<motion.circle
cx={x} cy={y} r={r + 4}
fill={dotFill}
animate={{ opacity: [0, 0.22, 0], r: [r + 4, (r + 4) * 1.8, r + 4] }}
transition={{ duration: 2.8, repeat: Infinity, ease: "easeInOut", delay: (x % 7) * 0.3 }}
/>
)}
{/* Active selection ring */}
{isActive && (
<motion.circle
cx={x} cy={y} r={r + 9}
fill="none" stroke={dotFill} strokeWidth="1.8"
animate={{ r: [r + 9, (r + 9) * 1.8, r + 9], opacity: [1, 0, 1] }}
transition={{ duration: 1.2, repeat: Infinity }}
/>
)}
{/* Main dot — gentle vertical float */}
<motion.circle
cx={x} cy={y} r={r}
fill={dotFill}
stroke={dotStroke} strokeWidth={tier===1 ? 1.5 : 1}
animate={{ translateY: [0, -1.8, 0] }}
transition={{
duration: 2.2 + (x % 3) * 0.4,
repeat: Infinity,
ease: "easeInOut",
delay: ((x + y) % 17) * 0.12,
}}
/>
{/* Specular highlight — tiny white spot */}
<circle
cx={x - r * 0.28} cy={y - r * 0.32} r={r * 0.28}
fill="#FFFAED" opacity="0.9"
/>
{/* Label — only visible at high zoom, placed ABOVE dot, never below */}
{labelOpacity > 0.01 && (
<g style={{ opacity: labelOpacity }}>
{/* White knockout outline for legibility on any land colour */}
<text
x={labelX} y={labelY}
textAnchor="middle"
fontFamily="'ZCOOL KuaiLe','Noto Sans TC',sans-serif"
fontSize={tier===1 ? 9 : 7.5}
fontWeight="800"
stroke="#FFF8E8"
strokeWidth="3"
strokeLinejoin="round"
paintOrder="stroke"
fill="#3A1205"
>
{region.name}
</text>
{/* Crisp fill on top */}
<text
x={labelX} y={labelY}
textAnchor="middle"
fontFamily="'ZCOOL KuaiLe','Noto Sans TC',sans-serif"
fontSize={tier===1 ? 9 : 7.5}
fontWeight="800"
fill="#3A1205"
>
{region.name}
</text>
</g>
)}
</g>

story:[
"1624年，荷蘭東印度公司（VOC）在台灣西南海岸的沙洲上建起了熱蘭遮城，用紅磚和灰泥築成，配備了大砲。",
"荷蘭人來台灣的目的很明確：建立一個連結日本、中國和東南亞的貿易轉運站。他們出口鹿皮到日本、進口中國絲綢轉銷歐洲。",
"為了獲得勞動力，荷蘭人大量招募福建移民來台種植甘蔗，這是漢人大規模移民台灣的開端。",
"荷蘭統治的38年雖然短暫，卻為台南留下了深刻印記：土地丈量制度、基督教傳教、羅馬拼音文字（新港文書）。",
"台南作為台灣最早的國際港口，連結了17世紀的全球化網絡——阿姆斯特丹的股東們，在帳本上記錄著台灣鹿皮的價格波動。",
"今天安平古堡的殘存紅磚牆，是荷蘭時期留在台灣最古老的歐式建築遺跡。",
]},
{ year:1661, title:"鄭成功攻台與荷蘭投降",
summary:"鄭成功率兩萬五千大軍渡海攻台，結束荷蘭統治，建立漢人政權。",
story:[
"1661年農曆四月，鄭成功從金門率領兩萬五千大軍和數百艘戰船出發，目標是奪取被荷蘭佔據的台灣。",
"據說當天鹿耳門的潮水異常大漲，讓鄭成功的大型戰船得以越過淺灘，從荷蘭人意料之外的方向包抄了熱蘭遮城。",
"經過九個月的圍城，荷蘭末任長官揆一在1662年2月1日簽署了投降書，率領殘餘的荷蘭人和奴隸離開了台灣。",
"鄭成功將台南改名為「東都明京」，設立了承天府，引進中國的行政制度、科舉考試和儒學教育。",
"這場戰役的影響遠超台灣：它是亞洲人第一次成功驅逐歐洲殖民者的軍事行動，比日本人打敗俄國（1905年）早了兩百多年。",
"今天台南的延平郡王祠和赤崁樓，記錄的就是這段從荷蘭到鄭氏的政權交替。鄭成功至今仍被台南人尊稱為「開台聖王」。",
]},
{year:1721,title:"朱一貴事件：台灣清治時代規模最大的民變",summary:"養鴨農朱一貴以「反清復明」為號召，十五天攻下台灣府城，建立短暫政權，震驚清廷。",story:["1721年五月，屏東人朱一貴以不滿清朝苛稅為由，聚眾起事，他宣稱自己是明朝皇室後裔，以『大明重興元帥』自居，迅速號召數萬人響應。","起義軍在兩週內席捲全台，攻下台灣府城（今台南）。知府、台灣道等官員倉皇出海逃回福建，清朝在台灣的統治幾乎全面崩潰。","清廷聞訊震動，立即從福建調派藍廷珍率水師來台，並以大量閩粵移民組成的『六堆客家義勇』協助平亂。不到三個月，朱一貴被俘，押送北京凌遲處死。","朱一貴事件暴露了清朝在台灣治理的根本矛盾：移民人口激增但政府設施不足、土地分配不公、渡台禁令造成男多女少的社會失衡。","事件後清廷調整台灣政策，增設彰化縣與淡水廳，但根本問題未解——台灣在清治時代三百年間共爆發大小民變超過三十次，『三年一小反，五年一大反』成為島嶼的宿命節奏。","今天台南市區的赤崁樓旁，仍有一塊記述此役的石碑。朱一貴短暫的『大明中興』是台灣人第一次以自己的力量建立政權，無論成敗，那十五天的短暫自治留在了集體記憶之中。"]}

story:[

{year:1927,title:"廣州起義：中共史上最慘烈的都市暴動",summary:"中國共產黨在廣州發動武裝起義，建立短暫的「廣州公社」，三天後遭國民黨軍隊血腥鎮壓，死亡人數超過五千人。",story:["1927年十二月十一日，中共在張太雷、葉挺等人率領下，在廣州發動武裝起義，宣布成立廣州蘇維埃政府，史稱「廣州公社」，這是繼上海四一二大屠殺後中共的最後一次大規模反撲。","起義軍佔領了廣州市區大部分地區，執行了大量針對「反動分子」的即決處決，廣州短暫陷入恐怖氣氛。","國民黨在張發奎的指揮下，聯合多路軍隊反攻，三天之內重奪廣州，對起義參與者展開報復性屠殺，外國領事館記錄的遇難人數超過五千七百人。","起義領導人張太雷在戰鬥中中彈身亡，成為中共歷史上第一位在武裝起義中犧牲的政治局委員。廣州起義的失敗宣告了中共城市中心路線的終結，毛澤東的農村包圍城市路線開始佔據主導地位。","蘇聯顧問的深度介入讓起義帶有濃烈的共產國際色彩，三艘停靠珠江的外國軍艦甚至砲擊了起義軍，這場暴動已超出純粹內政的範疇，演變為冷戰前夕的國際角力場。","今天廣州市烈士陵園的松柏樹林中，埋著那三天暴動的遇難者。廣州公社雖只存在七十二小時，卻是中共奪取政權漫長血路的重要刻度。"]}

{ year:1869, title:"開拓使設置與北海道命名",
summary:"明治政府設立開拓使，大規模移民開發北海道，並驅逐原住民阿伊努族的傳統領地。",
story:[
"1869年，剛完成明治維新的日本政府面臨一個緊迫問題：俄羅斯帝國正在向南擴張，與日本在蝦夷地（今北海道）的邊界摩擦日益頻繁。",
"政府決定以移民實邊的方式鞏固對北方領土的控制：設立「開拓使」機構，招募全國農民移居蝦夷地，並將其正式命名為「北海道」。",
"開拓的代價由阿伊努族承擔：他們在北海道生活了至少一萬年，卻在幾十年內被迫放棄語言、穿和服、改日本姓，傳統的獵鹿和捕魚習俗被全面禁止。",
"與此同時，明治政府從美國聘請了農業顧問，在北海道引進了西方式的農場制度——大型牧場、乳牛業、馬鈴薯種植——這讓北海道至今仍是日本的農業倉庫。",
"北海道的開拓史折射出明治日本的矛盾本質：一方面反抗西方殖民主義、一方面又對內部的少數民族進行同化式的「殖民」。",
"今天阿伊努族約有兩萬人仍生活在北海道，他們在2019年被日本政府正式承認為「原住民族」——距離被剝奪土地，恰好一百五十年。",
]},
{ year:1945, title:"蘇聯出兵與南千島群島（北方四島）問題",
summary:"二戰末期蘇聯對日宣戰，佔領千島群島南部，留下至今未解的領土爭議。",
story:[
"1945年8月8日，蘇聯在廣島原子彈爆炸後兩天，對日本宣戰。蘇軍以壓倒性兵力橫掃滿洲，同時向北海道最北端的千島群島發動了登陸攻勢。",
"8月15日，日本天皇宣布投降，但蘇軍並未停止行動：他們繼續佔領了擇捉、國後、色丹、齒舞四個群島——這四個日本稱為「北方領土」、俄羅斯稱為「南千島群島」的島嶼。",
"島上約一萬七千名日本居民在隨後幾年內被全部遣返，蘇聯公民隨即移入。七十八年後，這場領土交接的歷史遺留問題至今仍是日俄關係最大的障礙。",
"北方領土問題對北海道的影響是直接且持續的：稚內港的漁民每年都面對「這片海的另一邊是誰的」這個問題，兩國漁業糾紛時有發生。",
"這個問題也讓我們看到冷戰的荒誕邏輯：日本和俄羅斯至今沒有正式締結和平條約，技術上仍處於二戰的「戰爭狀態」，只是因為四個面積加起來不及台灣一半的小島。",
"今天在北海道稚內的最北端，天氣晴朗時可以望見薩哈林島（庫頁島）的輪廓——那是另一個被歷史和地緣政治切割的地方。",
]},
{year:1899,title:"北海道舊土人保護法：愛奴族被制度性消除的起點",summary:"日本頒布以『保護』為名的法律，強迫愛奴族放棄游獵定居耕作，剝奪其土地與語言，愛奴文明開始系統性瓦解。",story:["1899年日本政府頒布《北海道舊土人保護法》，表面上是給予愛奴族土地和農業補貼，實際上是強制推行農耕定居，廢除他們的漁獵傳統生活方式。","法律規定每戶愛奴家庭可獲得約一萬五千坪土地，但這些土地是『賦予』而非『歸還』，且禁止出售轉讓——意味著愛奴族在自己世代居住的土地上變成了客人。","愛奴語在學校被全面禁止，孩子被強制就讀日語學校，愛奴的薩滿信仰、刺青文化、獵熊祭儀被視為『落後習俗』而受到壓制。","二戰後這部法律仍持續有效，直到1997年才被《愛奴文化振興法》取代。在那近一百年間，愛奴語母語使用者從數萬人銳減至幾乎歸零。","2019年日本終於通過法律正式承認愛奴族為北海道的『先住民族』——距離《北海道舊土人保護法》頒布已整整一百二十年。這遲來的承認，承認了一段漫長而系統性的文化屠滅歷史。"]}

],
/* ────── NAGASAKI 長崎 ────── */
nagasaki: [
{ year:1641, title:"荷蘭商館遷入出島，鎖國時代的唯一窗口",
summary:"德川幕府驅逐所有西方人，唯獨允許荷蘭人在出島繼續貿易，長崎成為日本鎖國時代的唯一對外窗口。",
story:[
"1641年，德川幕府以防止基督教傳播為由，命令荷蘭東印度公司的商館從平戶遷至長崎港內一座人工填築的扇形小島——出島。",
"出島的面積只有1.5公頃，四面被水隔開，荷蘭商人進出受到嚴格管制，甚至連在島上種花都要向奉行所申請。",
"然而，這個小小的出島，卻成了日本與外部世界僅剩的知識管道：望遠鏡、顯微鏡、醫學書籍、天文學知識從這裡流入日本，形成了獨特的「蘭學」（荷蘭學問）。",
"長崎的歷史地位因此極為特殊：它是那個閉關鎖國的時代，日本僅有的一扇門縫——而正是從這個門縫透入的西方科學之光，為明治維新的工業化奠定了思想基礎。",
"長崎的對外開放也吸引了大量中國商人，形成了熱鬧的「唐人屋敷」（中國人居住區），讓長崎至今仍保有獨特的中華文化色彩，比如每年元宵節的燈籠節慶。",
"今天修復完成的出島遺址，是日本鎖國時代最完整的歷史現場，在那裡可以清楚感受到，一個國家在自我封閉與渴望知識之間的深層矛盾。",
]},
{ year:1945, title:"長崎原子彈爆炸",
summary:"1945年8月9日，美軍在長崎投下了人類歷史上第二枚、也是最後一枚在戰爭中使用的核武器。",
story:[
"1945年8月9日上午11時2分，一枚代號「胖子」的鈽彈在長崎市松山町上空約500公尺處爆炸，爆炸中心溫度超過攝氏三千度。",
"長崎在那一瞬間就有超過三萬五千人當場死亡，到1945年底，估計共有六至八萬人因核爆及其後的輻射傷害死亡——這比廣島略少，部分原因是山地地形阻隔了衝擊波。",
"長崎原本並非首要目標——原定目標小倉上空雲層過厚，轟炸機臨時改飛備用目標長崎。歷史的走向就這樣被一片雲改變了。",
"六天後日本宣布投降，長崎也因此成為了「最後一座被核武摧毀的城市」——這個地位，長崎人既不願擁有，卻也無法放棄，因為它賦予了他們向全世界傳遞反核訊息的道義責任。",
"長崎核爆的影響遠超日本：它與廣島一起震驚了世界，催生了此後七十年的核不擴散外交體系，雖然這個體系至今仍脆弱而不完整。",
"今天長崎平和公園裡的和平祈念像，左手指向天空（提醒核武的威脅）、右手平伸（象徵和平）——這個城市已將自身的悲劇，昇華為對全人類的叩問。",
]},
{year:1597,title:"二十六聖人殉教：長崎與基督教禁教時代的開端",summary:"豐臣秀吉在長崎處決二十六名天主教徒，是東亞歷史上著名的宗教迫害事件，奠定日本鎖國政策的精神基礎。",story:["1597年二月，二十六名天主教徒——包括六名方濟各會傳教士、三名耶穌會修士，以及十七名日本信徒——被從大阪押送至長崎，在此地以十字架釘死。","豐臣秀吉此前雖頒布禁教令，實際執行並不嚴格。這次大規模處決的直接導火索是一艘西班牙商船的船長誇口說，傳教士是西班牙征服海外殖民地的先行工具，此言令秀吉大怒。","二十六人在零下嚴寒中從大阪徒步走了一個月，沿途仍不斷祈禱傳教。行刑時，目擊者記載他們臉上毫無恐懼，齊聲唱著聖歌。此情此景反而在當地民眾中引發更多人皈依基督教。","1862年教宗庇護九世將這二十六人封為聖人，命名為『日本二十六聖人』。長崎在二十六聖人殉教處建立了紀念教堂，成為全球天主教徒的重要朝聖地。","長崎的基督教歷史充滿悖論：這裡是日本天主教的發源地，卻也是迫害最慘烈之處；這裡曾有最多基督徒的日本城市，到了江戶鎖國時代，信徒只能以祕密的方式代代相傳信仰，形成獨特的『潛伏基督徒』文化，在世界宗教史上絕無僅有。"]}

],
/* ────── OSAKA 大阪 ────── */
osaka: [
{ year:1583, title:"豐臣秀吉築造大阪城，天下統一",
summary:"結束戰國亂世的豐臣秀吉在大阪建造了日本最壯觀的城堡，以商業立國的大阪開始成型。",
story:[
"1583年，從農民起家的豐臣秀吉開始在大阪（當時稱「大坂」）建造他心目中最宏偉的城堡——大坂城。",
"城堡歷時三年、動員三萬工人，外牆用從全國搜集來的巨石砌成，金箔裝飾的天守閣在陽光下閃耀，在幾十公里外就能看見。",
"秀吉選擇大阪，是因為它地處水陸交通的樞紐：三條河川在此交匯入海，北可至京都、南可通四國九州，是天然的商業中心。",
"為了鞏固統治，秀吉把全國的商人和工匠大量遷入大阪，讓這裡從一個軍事要塞迅速蛻變為日本最重要的商業城市——「天下廚房」（日語：天下の台所）的美名由此而來。",
"大阪的商業文化孕育出了獨特的平民藝術：文樂（木偶淨琉璃）、歌舞伎、落語——這些充滿人情味和諷刺精神的藝術形式，至今仍是大阪文化的DNA。",
"今天大阪城公園的天守閣雖然是1931年重建的，但站在那裡俯瞰大阪市區，還是可以感受到秀吉當年「天下人」的豪情壯志。",
]},
{ year:1970, title:"大阪世界博覽會",
summary:"日本以世博會向世界展示戰後奇蹟式的復興，大阪成為亞洲第一個主辦世博的城市。",
story:[
"1970年，大阪舉辦了亞洲歷史上的第一次世界博覽會，主題是「人類的進步與和和諧」，吸引了超過六千四百萬名參觀者。",
"這個數字放在今天也是驚人的——相當於當時日本人口的三分之二親身走進了會場，感受那個「明天會更好」的時代氛圍。",
"世博對大阪的城市基礎設施是一次大躍進：大阪地鐵北大阪急行線、新幹線延伸、高速公路網絡都在這段時期完成。",
"但世博更重要的意義是象徵性的：1945年還是一片焦土的日本，在短短二十五年內成為世界第二大經濟體，大阪以此告訴全世界：亞洲可以現代化，而不需要成為西方的複製品。",
"這屆世博的影響波及整個亞洲：它讓韓國、台灣、新加坡相信「亞洲四小龍」的奇蹟是可以複製的，間接點燃了整個東亞的經濟騰飛熱情。",
"太陽塔——藝術家岡本太郎設計的那座三面怪臉的混凝土巨像——至今仍矗立在萬博紀念公園，成為那個充滿理想主義的年代最奇異的紀念碑。",
]},
{year:1615,title:"大阪夏之陣：豐臣家族覆滅，德川天下確立",summary:"德川家康攻陷大阪城，豐臣秀賴與母親自盡，結束了戰國時代的最後懸念，日本迎來兩百五十年的太平盛世。",story:["1615年夏，德川家康率二十萬大軍圍攻大阪城，在前一年冬之陣後豐臣方填平壕溝的背景下，大阪城失去了最關鍵的防禦優勢。","五月七日，德川軍突破防線，大阪城天守閣陷入火海。豐臣秀賴與生母淀姬（豐臣秀吉的側室）自盡於城中，豐臣家族至此絕滅。","這場戰役結束了自應仁之亂以來長達一個半世紀的戰國動亂時代。德川家康完全消除了唯一能與其抗衡的政治勢力，江戶幕府的統治從此進入穩固期。","大阪城的陷落深刻影響了這座城市的性格：它從政治中心轉型為商業中心，大量武士沒落後轉為商人，形成了關西町人文化的基礎——務實、精打細算、輕視武家威嚴、重視交易誠信。","『武士道源自大阪，町人心性也源自大阪』——這座城市的靈魂，是在那場大火的灰燼上重建的。今天大阪城公園內的天守閣是1931年重建的，但站在護城河邊，仍能感受到四百年前那場足以改變日本命運的最後決戰的迴響。"]}

],
/* ────── PYONGYANG 平壤 ────── */
pyongyang: [
{ year:1945, title:"蘇聯佔領北朝鮮與金日成崛起",
summary:"二戰結束後蘇聯軍隊進駐平壤，扶植金日成建立朝鮮勞動黨政權，朝鮮半島開始分裂。",
story:[
"1945年8月，蘇聯對日宣戰，紅軍迅速佔領了三八線以北的朝鮮。與此同時，美軍則進駐了三八線以南，以「暫時分區佔領」為由接管了朝鮮半島南半部。",
"蘇聯選中了在中國東北抗日的游擊隊長金日成，讓這位當時只有三十三歲的年輕人回到平壤，出任朝鮮勞動黨的領導人。",
"平壤被改造為社會主義首都：日本殖民時期的建築被拆除，取而代之的是仿效莫斯科的宏大廣場和列柱建築，金日成的巨型肖像掛上了每一個公共建築的正面。",
"1948年，朝鮮民主主義人民共和國正式成立，朝鮮半島的分裂從「暫時佔領」演變為「永久分斷」。",
"兩年後的1950年，金日成在蘇聯和中國的默許下發動了南侵，引爆了韓戰——這場戰爭讓數百萬人失去生命，並將南北朝鮮的仇恨凝固至今。",
"今天的平壤是一座被刻意設計出來的「展示城市」，高聳的主體思想塔和空曠的金日成廣場，是世界上最不尋常的城市景觀——一座用石頭和混凝土建造的意識形態。",
]},
{year:1592,title:"壬辰倭亂：平壤的陷落與明朝援軍",summary:"豐臣秀吉入侵朝鮮，平壤在兩個月內淪陷，明朝派兵援救，戰爭歷時七年，深刻改變東北亞格局。",story:["1592年六月，加藤清正與小西行長率日軍在不到兩個月內從釜山打到平壤，朝鮮宣祖王倉皇出逃義州，平壤隨即淪陷。這是半島歷史上最快速的軍事崩潰之一。","日軍的武器優勢是關鍵——大量火繩槍讓朝鮮弓箭手和騎兵無法抵擋。但在制海權上，李舜臣的龜船屢破日軍補給線，讓陸上的快速推進難以為繼。","萬曆帝應朝鮮之請，派遼東都督李如松率四萬明軍入朝，1593年一月大破日軍，收復平壤。這是明朝最後一次大規模對外出兵，也是明清之際最被低估的關鍵戰役之一。","戰爭拖延七年，消耗了日本、朝鮮、明朝三方的國力。豐臣秀吉在1598年病死，日軍隨即撤退。但代價慘重：朝鮮人口銳減三分之一，明朝財政元氣大傷，女真族（後來的清朝）趁機壯大。","平壤的歷史地位從此確立：既是被征服的城市，也是抵抗的象徵。朝鮮人把李舜臣的龜船故事世代傳頌，而明朝援兵的歷史在今天的中朝關係語境中，仍是兩國官方反覆援引的『鮮血凝成的友誼』的起點之一。"]},
{year:1950,title:"韓戰中的平壤：兩度易主，志願軍改變戰局",summary:"平壤在韓戰中先被聯合國軍攻佔，後因中國人民志願軍介入而易手，成為冷戰最激烈的交戰點之一。",story:["1950年九月，麥克阿瑟在仁川登陸後反攻北上，十月十九日聯合國軍攻入平壤，這是第二次世界大戰後第一次有外國軍隊佔領一個社會主義國家的首都。","然而就在同一天，中國人民志願軍在彭德懷指揮下秘密越過鴨綠江入朝參戰，戰局在接下來幾週內急轉直下，志願軍以人海戰術擊潰了聯合國軍。","十二月，聯合國軍棄守平壤撤退，金日成政權恢復對北朝鮮的控制。平壤在這三個月的佔領與反佔領中遭受了史上最密集的空中轟炸，全城幾乎夷為平地。","中國志願軍的介入是20世紀東北亞地緣政治的最大轉折點之一：它確保了北朝鮮政權的存活，也讓台灣問題因美國第七艦隊協防而凍結，冷戰的亞洲格局從此固化超過半個世紀。","今天平壤的城市景觀是戰後全新規劃的，寬闊的大街、巨型紀念碑和整齊的公寓樓都是1950年代以後建造的。這座城市的每一塊磚，都是從那場讓整個城市消失的大火中，一磚一瓦重新疊砌起來的。"]}

story:[

{year:1876,title:"江華條約與釜山開港：朝鮮的第一扇強制開啟的窗",summary:"日本以砲艦外交逼迫朝鮮簽訂不平等條約，釜山成為最先開放的港口，朝鮮的閉關鎖國時代正式終結。",story:["1875年，日本軍艦雲揚號以『測量』為藉口駛入江華島，挑釁朝鮮岸防砲台，製造衝突藉口。翌年逼迫朝鮮簽署《江華條約》，這是完全模仿日本當年被美國強迫開國的劇本。","條約規定釜山、仁川、元山三港對日開放，日本人在朝鮮享有治外法權，朝鮮喪失關稅自主權——這些條款與西方列強強加給清朝和日本的不平等條約如出一轍。","釜山作為對日距離最近的港口，從此成為日本移民和商品進入朝鮮的主要門戶。日本商人在釜山設立的商行，二十年後演變為支配朝鮮半島經濟的殖民商業網絡。","《江華條約》的衝擊讓朝鮮王朝內部爆發了改革派（開化派）與保守派（衛正斥邪派）的激烈衝突，這場論爭最終在1895年甲午戰爭後由日本的砲火強行裁決。","釜山的開港，是東北亞近代化浪潮最具體的起點之一：從這裡進入的不只是商品，還有報紙、鐵路概念、電報技術，以及關於『民族國家』的陌生想像。這些改變了朝鮮半島，並在幾十年後讓日本自食其果——它輸出的『近代化』最終孕育了反抗殖民統治的思想武器。"]}

{ year:1860, title:"北京條約與俄羅斯佔領海參崴",
summary:"第二次鴉片戰爭後，俄羅斯趁清朝虛弱割佔烏蘇里江以東大片土地，海參崴從此成為俄國太平洋出口。",
story:[

{year:1905,title:"日俄戰爭後的海參崴：亞洲第一次擊敗歐洲強權的震波",summary:"日本擊敗俄國，海參崴從東亞最強大的俄國海軍基地變成龐大帝國開始衰退的象徵，震撼了整個亞洲民族主義運動。",story:["1904年，日俄兩國為爭奪中國東北與朝鮮的控制權爆發戰爭，日本海軍在對馬海峽一役幾乎全殲俄國波羅的海艦隊，這支艦隊原本是要趕赴海參崴解圍的。","對馬海戰讓海參崴的太平洋艦隊被完全孤立，日本陸軍圍攻旅順（今大連旅順區），俄國試圖通過漫長的西伯利亞大鐵路輸送援軍，但效率低下，戰局無法逆轉。","1905年《朴茨茅斯條約》簽訂後，俄國保住了海參崴，但喪失了旅順、南滿鐵路和庫頁島南半部。海參崴從此永久失去作為太平洋攻勢基地的戰略意義，轉為防禦性要塞。","日俄戰爭的衝擊波在整個亞洲引發巨大迴響：亞洲國家第一次目睹有色人種擊敗白人帝國，印度、越南、土耳其、伊朗的民族主義運動從此進入高漲期；孫中山在檀香山聽到戰報時激動落淚，他看到了推翻清朝後新中國的可能。","海參崴在這場戰爭中見證的教訓是：遠離本土的海外帝國主義，終究難以抵禦在自家門口作戰的對手。這個教訓，俄國在冷戰期間再次遺忘，在阿富汗付出了代價。"]},
{year:1992,title:"海參崴對外開放：冷戰結束後的極東窗口",summary:"蘇聯解體後海參崴結束五十年的軍事封閉，向外國人開放，俄羅斯遠東開始艱難融入太平洋經濟圈。",story:["1991年蘇聯解體，海參崴作為太平洋艦隊母港的戰略機密狀態隨之解除，1992年葉利欽宣布對外開放，這座被鐵幕封閉了五十年的城市第一次迎接外國遊客。","開放初期，最先湧入的是來自中國東北、韓國和日本的商人，他們帶來了廉價商品、二手汽車和餐廳資本，在短短幾年內讓海參崴的街頭面貌發生翻天覆地的變化。","然而開放帶來的不只是機遇，還有衝擊：盧布崩潰讓公務員和軍人的工資一夜之間縮水九成，太平洋艦隊無力支付電費，軍艦在港口銹爛，潛水艇的核廢料管理問題引發了嚴重的環境危機。","海參崴的開放也讓這座城市意識到自己被遺忘的文化身份：城市裡到處是韓語招牌，因為這裡曾是大韓帝國流亡者的集散地；日本研究者前來尋訪日俄戰爭的遺跡；中國商人則帶回了這片土地在《北京條約》前曾是中國疆土的歷史記憶。","今天的海參崴是俄羅斯試圖建立亞太身份的實驗場：海參崴已更名為『符拉迪沃斯托克自由港』，並被列為東方經濟論壇的主辦地。但這座城市與莫斯科相距一萬公里的物理距離，決定了它始終是俄羅斯帝國版圖上一個遙遠而孤獨的極東哨站。"]}

{year:1690,title:"伊爾庫次克：西伯利亞毛皮帝國的心臟",summary:"伊爾庫次克發展為西伯利亞最重要的貿易樞紐，中俄毛皮貿易在這裡達到頂峰，奠定了俄羅斯橫跨歐亞大陸的商業基礎。",story:["1661年俄羅斯哥薩克人在安加拉河畔建立伊爾庫次克冬季住所，因其正好位於西伯利亞中部、連接貝加爾湖東西的咽喉要道，迅速成為毛皮交易的集散中心。","1690年前後，中俄簽訂《尼布楚條約》（1689年）後，伊爾庫次克成為合法的中俄貿易通道，大批商隊往來於此，用西伯利亞的貂皮、海獺皮交換中國的茶葉、絲綢和陶瓷。","毛皮財富讓伊爾庫次克快速城市化，被稱為『西伯利亞的巴黎』，富商建起歐式石造宅邸，東正教大教堂拔地而起，甚至有了西伯利亞第一所圖書館。","但毛皮貿易的繁榮是建立在生態毀滅之上的：到了18世紀末，西伯利亞的貂和海獺幾近滅絕，俄羅斯的毛皮帝國不得不向阿拉斯加延伸，最終推動了俄羅斯在北美的殖民擴張。","伊爾庫次克的繁榮故事提醒我們：每一個資源型經濟的輝煌時代，都同時是資源本身的死亡倒計時。這個道理，在21世紀的西伯利亞石油和天然氣時代，依然有效。"]},
{year:1941,title:"西伯利亞工廠大西遷：衛國戰爭中伊爾庫次克的角色",summary:"納粹德國入侵後，蘇聯將一千五百座工廠從歐洲部分遷至西伯利亞，伊爾庫次克成為蘇聯戰時工業的重要後方基地。",story:["1941年六月德國入侵蘇聯，短短幾週內大批工業城市面臨淪陷威脅。史達林下令將整座整座工廠拆解裝車，向東撤往烏拉山脈以東的西伯利亞和中亞，這是人類歷史上最大規模的工業遷移行動。","伊爾庫次克因遠離前線、擁有安加拉河水力資源，成為重工業的主要接收地。飛機製造廠、機床工廠、彈藥工廠在零下四十度的荒地上拆卸到了車廂，工人們睡在臨時搭建的木棚中，機器甫到即開工。","工廠遷移的速度快得令人難以置信：許多工廠從拆解到恢復生產僅僅花了兩到三週，工人在機器旁邊紮營生產，露天車間在嚴冬中照常運作，戰鬥的意志彌補了一切物質條件的不足。","這場工業大西遷是蘇聯最終逆轉戰局的關鍵因素之一：1942年開始，遠離前線的西伯利亞工廠源源不斷地提供坦克、飛機和彈藥，斯大林格勒保衛戰所需的物資，有相當一部分來自伊爾庫次克。","戰後這些工廠留了下來，伊爾庫次克從純商業城市轉型為重工業城市。這場意外的工業化，讓西伯利亞從此不再只是流放之地，而成為蘇聯帝國真正的工業脊梁。"]}

/* ────── NOVOSIBIRSK 新西伯利亞 ────── */
novosibirsk: [
{ year:1893, title:"西伯利亞大鐵路帶來的城市誕生",
summary:"一座橋，讓新西伯利亞從一個渡口村落在二十年內成長為西伯利亞最大的城市。",
story:[
"1893年，俄羅斯帝國正在推進人類史上最宏大的工程之一——橫貫歐亞大陸的西伯利亞大鐵路。在鄂畢河畔，工程師決定在此建橋，一個橋梁工地的工人營地就這樣誕生了。",
"這個工地的地點後來有了名字：新尼古拉耶夫斯克（1925年改名新西伯利亞）。它沒有任何歷史積澱，有的只是鐵路帶來的移民潮和商業機會。",
"西伯利亞大鐵路通車後，新西伯利亞以驚人的速度膨脹：20年後人口突破10萬，40年後突破50萬——這是工業時代「鐵路決定城市命運」的最完美案例。",
"二戰期間，蘇聯將大量工廠從西部地區緊急拆遷至新西伯利亞，躲避德軍的空襲，這進一步強化了它作為工業中心的地位。",
"1957年，赫魯雪夫批准在新西伯利亞郊外建立「學術城」（Akademgorodok），把數十個科學研究所和大學遷至此地，讓這個工業城市意外成為蘇聯最重要的科學研究中心。",
"今天的新西伯利亞是一座典型的蘇聯風格城市：宏大的廣場、灰色的公寓和世界級的科學研究機構並存，是那個試圖用鋼鐵和知識征服西伯利亞的雄心時代的縮影。",

{year:1941,title:"西伯利亞工廠大遷移：新西伯利亞成為蘇聯戰時工業心臟",summary:"二戰爆發後蘇聯大規模工廠西遷，新西伯利亞在短短幾個月內從鐵路城市轉變為重工業重鎮，奠定其現代城市格局。",story:["1941年德國入侵蘇聯後，新西伯利亞因位於西伯利亞鐵路中部、遠離前線，成為工廠遷移的重要目的地。列寧格勒和莫斯科的電子、機械、軍工廠被整體拆解裝運。","遷移來的工廠包括製造飛機零件、無線電設備的精密工廠。工人與機器同乘一列車，抵達後在零下二三十度的荒地上打樁建棚，有些工廠在屋頂蓋好之前就開始生產，雪花落在機床上。","這一批工廠在戰後全部留了下來，新西伯利亞的工業人口從戰前的四十萬激增到七十萬，城市規模在五年內幾乎翻倍。戰爭意外地完成了一次大規模城市化。","戰時疏散帶來的不只是工廠，還有大量知識分子——列寧格勒的音樂家、莫斯科的大學教授、基輔的工程師，都隨廠遷移至此。這批人的留駐為後來建立科學城埋下了種子。","新西伯利亞的城市性格因此呈現獨特的雙重性：粗獷的西伯利亞邊疆氣質，與列寧格勒式的知識文化傳統奇異地並存；這兩種性格，在戰火中被焊接在一起。"]},
{year:1957,title:"新西伯利亞科學城（Akademgorodok）：科學烏托邦在西伯利亞的誕生",summary:"蘇聯在新西伯利亞郊外建造了世界上最大的科學城，集中數十個研究所和一萬名科學家，曾是全球最密集的學術聚落。",story:["1957年，在蘇聯發射人造衛星史普尼克一號同一年，蘇聯科學院院士拉夫連捷夫說服赫魯雪夫，在新西伯利亞郊外的松林中建造一座全新的科學城——Akademgorodok（學術城）。","科學城設計理念激進：數十個研究所圍繞著一所大學建造，科學家和家屬都住在城內，有自己的電影院、俱樂部和海灘（奧畢海）。這裡被設計成一個讓科學家安心研究、不受政治干擾的烏托邦。","1960年代，科學城迎來了鼎盛期，物理、化學、數學、生物各領域的頂尖學者聚集於此，晚宴上的討論可以橫跨核物理和史達林主義批判，這種自由在蘇聯其他地方是不可想像的。","1968年蘇聯入侵捷克斯洛伐克後，科學城有幾百名知識分子聯名簽署抗議信，隨後遭到KGB調查和降職處分。科學城的短暫自由氛圍被政治寒冬壓垮。","今天新西伯利亞科學城仍然存在，容納了多所大學和研究所，俄羅斯的IT產業在此有重要基地。但當年試圖在西伯利亞建立知識烏托邦的宏大夢想，已成為一段珍貴而悲哀的歷史。"]}

/* ────── YAKUTSK 雅庫茨克 ────── */
yakutsk: [
{ year:1632, title:"哥薩克探險者建立雅庫茨克要塞",
summary:"俄羅斯哥薩克騎士越過烏拉山，在永凍土上建立據點，開啟了對東北亞的掠奪式擴張。",
story:[
"1632年，沙俄哥薩克探險隊長普揚科夫在勒拿河畔建立了一座木製要塞，這就是雅庫茨克的前身。",
"哥薩克人來西伯利亞的目的很簡單：毛皮。當時西歐上流社會對貂皮、海獺皮的需求無止境，而西伯利亞的森林裡滿是這些動物。",
"他們以武力強迫當地薩哈（雅庫特）族繳納「毛皮稅」，不服從的部落遭到屠殺或奴役。在短短五十年內，西伯利亞的皮草動物幾乎被獵殺殆盡。",
"然而雅庫茨克的歷史地位不止於此：它是俄羅斯探險家繼續向東北亞探索的跳板，大半個西伯利亞的地理知識都是從這裡出發一點一點繪製出來的。",
"雅庫茨克建立在連地基都無法打入地下的永凍土上，每棟建築都必須架高建造，以防融化的地基讓房子傾斜——這讓它成為世界上最奇特的城市景觀之一。",
"今天雅庫茨克的冬天可達零下六十度，是世界上最寒冷的永久居住城市。它的鑽石礦讓俄羅斯成為世界最大的天然鑽石出口國，一如四百年前的毛皮，雅庫茨克的財富仍在流向遙遠的地方。",
]},
{year:1943,title:"古拉格在雅庫特：史達林的西伯利亞人間地獄",summary:"雅庫特成為蘇聯古拉格集中營的核心區域，數十萬政治犯在極寒環境中挖金礦、伐木，死亡率觸目驚心。",story:["1930年代起，史達林的大清洗製造了數以百萬計的『人民公敵』，這些政治犯被輸送到西伯利亞的古拉格勞改營，雅庫特因地廣人稀、氣候嚴酷、逃脫幾乎不可能，成為古拉格體系的重要組成部分。","雅庫特的科雷馬地區（嚴格說是鄰近的馬加丹管轄範圍延伸至此）在二戰期間達到囚犯人數頂峰，估計超過十萬人在那裡服刑，開採黃金、挖礦、修路。雅庫特自身也有多個大型勞改營。","在零下五十度的嚴冬中，囚犯以每天幾百克麵包維生，在露天礦坑勞作十二小時以上。一個囚犯平均的存活期，在某些惡名昭著的營地不超過三個月。","作家索忍尼辛在《古拉格群島》中詳細記錄了這套系統，書中的許多細節來自對雅庫特和科雷馬倖存者的訪談。這部書後來成為蘇聯道德清算最重要的文學見證。","冷戰結束後，雅庫特當地開始尋找和整理古拉格遺址。永凍土保存了許多當年的證物——包括囚犯的遺體和文件——成為人類歷史上最獨特也最殘忍的『冷凍歷史檔案館』。"]},
{year:1953,title:"雅庫特鑽石礦發現：永凍土下的意外寶藏",summary:"蘇聯地質學家在雅庫特發現世界最大鑽石礦床，改變了全球鑽石市場，也讓這座城市從流放地蛻變為資源重鎮。",story:["1953年，蘇聯地質學家拉里薩·波波嘉依在雅庫特西部的米爾內地區發現了金伯利岩筒——這是鑽石礦床的直接標誌。她隨即發出電報，以暗語報告：『點燃了雪茄，烟霧極美。』","這個發現的規模超出任何人的預期。米爾內礦場最終成為世界最大的鑽石礦坑之一，開採出的礦坑深達五百二十五公尺，直徑一千兩百公尺，已被列為世界奇觀之一。","雅庫特的鑽石產量讓蘇聯成為全球最大的鑽石出口國，也讓蘇聯得以用鑽石換取西方外匯，支撐冷戰期間的軍備競賽。蘇聯透過秘密協議向南非的戴比爾斯公司銷售鑽石，這段奇異的冷戰商業合作延續了數十年。","在永凍土上建造礦業城市面臨前所未有的工程挑戰：每一根支柱必須深埋至永凍層以下，稍有不慎建築就會傾斜下沉。如今全球氣候暖化讓永凍土融化，雅庫特的建築正在以肉眼可見的速度開始歪斜沉降。","雅庫特的鑽石故事，是關於資源發現如何改變地緣政治的完美案例。但它同時也是一個警示：在氣候變遷的衝擊下，建立在永凍土之上的一切，都面臨著比任何人預期都更快到來的崩塌。"]}

],
/* ────── KHABAROVSK 哈巴羅夫斯克 ────── */
khabarovsk: [
{ year:1858, title:"愛琿條約與哈巴羅夫斯克的建立",
summary:"俄羅斯以武力威脅逼迫清朝簽下《愛琿條約》，割佔黑龍江以北大片領土，哈巴羅夫斯克成為遠東軍事中心。",
story:[
"1858年，英法聯軍正在進攻北京，清廷焦頭爛額之際，俄羅斯軍官穆拉維約夫帶著炮艦沿黑龍江而下，逼迫清朝地方官員簽下《愛琿條約》。",
"條約將黑龍江以北、外興安嶺以南約60萬平方公里的土地割讓給俄羅斯，並在今天哈巴羅夫斯克的位置設立了軍事據點，命名為「伯力」。",
"僅僅兩年後的1860年，又一紙《北京條約》讓烏蘇里江以東的領土也落入俄羅斯之手。清朝在百年間損失了超過一百五十萬平方公里的土地，僅此兩份條約就佔了大半。",
"哈巴羅夫斯克的地理位置極為關鍵：它控制著黑龍江與烏蘇里江的交匯口，是俄羅斯遠東最重要的軍事和行政中心，也是西伯利亞大鐵路東端的核心樞紐。",
"中俄之間圍繞這些條約的歷史恩怨，在1969年的珍寶島武裝衝突中達到頂點——兩個社會主義大國為了烏蘇里江中的一個小島差點爆發全面戰爭。",
"今天哈巴羅夫斯克市中心的穆拉維約夫-阿穆爾斯基廣場上，那個逼迫清朝割地的俄羅斯將軍的銅像仍然矗立著，對岸的中國黑河市隱約可見。",
]},
{year:1938,title:"哈桑湖衝突：蘇日邊境的武裝對峙",summary:"蘇聯與日本關東軍在哈巴羅夫斯克南部的哈桑湖爆發武裝衝突，是二戰前夕東北亞最嚴峻的邊境危機之一。",story:["1938年七月，日本關東軍以邊境爭議為由，出兵佔領哈桑湖附近的沙草峰高地，這裡距哈巴羅夫斯克約一百公里，靠近蘇聯、中國、朝鮮三國交界。","朱可夫的前任指揮官布柳赫爾調集裝甲部隊反攻，雙方投入約兩萬五千人，激戰十八天後日軍撤退。蘇聯宣稱勝利，但雙方傷亡均超過三千人。","哈桑湖衝突是日蘇之間試探對方底線的多次武裝衝突之一，翌年更大規模的諾門罕事件（哈拉哈河之戰）隨即發生。這一系列衝突讓日本意識到蘇聯在遠東的軍事實力不可小覷，最終促使日本南下太平洋而非北進西伯利亞。","對哈巴羅夫斯克而言，這場衝突是城市歷史上最接近真實戰爭的時刻。日本的北進威脅迫使蘇聯大幅加強遠東軍事部署，哈巴羅夫斯克從行政城市快速擴建為重要的軍事要塞。","哈桑湖衝突的歷史意義常被忽視，但它在某種程度上塑造了整個太平洋戰爭的走向：正是因為蘇聯在哈桑湖和諾門罕兩次展示了強大的裝甲兵力，才讓日本最終選擇偷襲珍珠港，而非進攻西伯利亞。"]}
,{year:1969,title:"珍寶島武裝衝突：中蘇最近一次戰爭的邊緣",summary:"中蘇兩國在哈巴羅夫斯克附近的烏蘇里江珍寶島爆發武裝衝突，兩個社會主義大國為一個小島差點引爆核戰。",story:["1969年三月，中蘇邊境長期緊張的局勢在珍寶島（蘇方稱達曼斯基島）終於爆發，中國解放軍事先伏擊蘇聯邊防巡邏隊，蘇方隨即以坦克和火砲反擊，雙方各有傷亡。","這場衝突震驚全球：兩個擁有核武的社會主義大國公開武裝對抗，打破了西方對共產主義陣營鐵板一塊的想像，也讓北京和莫斯科在整個1960年代積累的意識形態分歧以最暴力的方式公開化。","蘇聯高層認真討論了對中國核設施進行先發制人攻擊的可能性，美國情報機構截獲了這些討論，並悄悄向中方透露。這個訊息加速了毛澤東決定改善對美關係——尼克森訪華的種子，在珍寶島的砲聲中發芽。","衝突地點珍寶島位於哈巴羅夫斯克南約三百公里的烏蘇里江中，《愛琿條約》的模糊措辭讓島嶼歸屬成為爭議焦點。1969年的流血事件讓這條百年前強加於中國的不平等條約，成為冷戰時代東北亞最危險的地緣炸彈。","珍寶島事件最終以雙方保持克制收場，但它留下的遺產是深遠的：中蘇邊界長達十年持續緊張，中美關係破冰，毛澤東以聯美抗蘇重塑了冷戰格局。一個孤島改變了世界。"]}

hualien: [
{ year:1874, title:"牡丹社事件後的開山撫番：後山的開發",
summary:"清廷受到外力刺激後積極開發台灣東部，花蓮作為「後山」首次進入帝國視野。",
story:[

{ year:1951, title:"花蓮大地震與東海岸的地震帶認識",
summary:"連續兩次大地震改變了花蓮的地景與人口分布，也讓台灣社會開始認識自己腳下那條活躍的斷層帶。",
story:[

{year:1937,title:"太魯閣族集體移住：日本殖民的最後強制遷移",summary:"日本殖民政府強制將太魯閣峽谷深山的族人遷移至海岸平地，切斷了族人與祖靈地的千年連結。",story:["1914年日軍發動太魯閣戰役，以兩萬兵力征服花蓮內山的太魯閣族，此後進行長達二十年的管控政策，1937年起全面實施『集體移住』，強制把深山各部落遷移至海岸平原的管制區。","移住的理由既是方便管理，也是因為二次世界大戰爆發，日本需要大量原住民青壯年加入『高砂義勇隊』赴南洋作戰——留在深山管制不易，集中至平地便於徵召。","對太魯閣族人而言，離開祖先的獵場和祭祀地點，意味著與祖靈的切斷，是文化和精神上的死亡。族人被安置在陌生的平地，要從事不熟悉的農耕，生活習慣和飲食全面改變，疾病死亡率大幅上升。","二戰結束後，部分族人試圖返回山上的祖居地，但原有的石板屋聚落已被自然侵蝕；更多人則永久留在了海岸，形成今日花蓮海岸的太魯閣族聚落分布格局。","今天太魯閣峽谷是台灣最著名的觀光景點，每年吸引數百萬人次的遊客，但很少有人知道峽谷深處那些廢棄的石板屋遺址，正是一段強制移民歷史的無聲見證。"]}

/* ────── TAITUNG 台東 ────── */
taitung: [
{ year:1895, title:"知本事件：卑南族的遷移與台東的日治開端",
summary:"日本接收台灣後，台東卑南族的抵抗與協商，展現了原住民族在殖民政權更迭中的能動性。",
story:[
"1895年日本接收台灣，台東廳成為日本統治下行政建置最晚設立的區域之一。這裡的原住民族——卑南族、阿美族、排灣族——在清代長期保有較大的自治空間。",

"台東的地理位置——台灣最東南端、面對太平洋——讓它成為台灣與南島語族遷徙路線的交會點。語言學和基因研究都顯示，台灣東海岸正是南島民族向太平洋擴散的起點。",

{year:1953,title:"退輔會台東農場：老兵與後山的開墾史",summary:"國民政府設立退除役官兵就業輔導委員會，大批外省老兵被安置到台東開墾荒地，形成台東特殊的移民農業文化。",story:["1949年國民政府撤退台灣，帶來了超過一百二十萬的外省軍民。1954年成立退輔會，目標是解決大批無法退伍的老兵的生計問題，同時開發台灣東部的廣大土地。","台東的池上、關山、鹿野等地被規劃為農場用地，大批老兵在這裡接受農耕訓練，從中國北方的麥田或廣東的漁村，轉型為台灣東部的稻農，用不熟悉的手種著不熟悉的土地。","退輔會農場的文化影響超出農業本身：外省老兵帶來了各省的飲食習慣，與原住民族和閩客族群融合，台東因此發展出台灣最多元的飲食文化，從山東麵食到客家擂茶到阿美族醃豬肉，在同一條街上並列。","許多老兵在台東成家生根，卻終其一生也無法回到故鄉，他們的鄉愁化為了後山土地上最獨特的人文景觀。池上米的聲名遠播，部分要歸功於這批用北方農耕精神澆灌出的稻米品質。","2023年池上稻田成為金曲獎頒獎典禮的背景，鏡頭掃過那片金黃稻浪的瞬間，是七十年前一批流亡老兵在陌生土地上開墾夢想的最美回響。"]},
{year:1988,title:"蘭嶼核廢料抗議：台東達悟族的環境正義運動",summary:"台灣政府在蘭嶼設置核廢料儲存場，引發達悟族長達數十年的抗議，成為台灣環境正義運動的重要里程碑。",story:["1974年台電以『魚罐頭工廠』名義欺騙蘭嶼達悟族居民，在島上東南部秘密興建核廢料貯存場，直到1978年第一批核廢料桶運抵，族人才知道真相。","達悟族的傳統宇宙觀中，土地和海洋是祖靈的居所，在祖靈的土地上堆放『惡靈之物』（核廢料），是不可原諒的褻瀆。1988年，達悟族人第一次發動大規模抗議，以傳統船屋為背景舉牌抗議，成為台灣原住民族環境運動的標誌性影像。","抗議訴求不只是遷移核廢料，更是要追究欺騙的責任，以及要求對達悟文化的正式道歉。然而台電的承諾一再跳票，從1996年的遷出期限，到2002年，到2016年……核廢料至今仍在蘭嶼。","蘭嶼事件讓台灣社會開始正視原住民族的土地權利與環境正義，影響了後來《原住民族基本法》的立法，以及台灣環境影響評估程序中原住民族諮商的納入。","達悟族人說：『我們不是環保團體，我們是為了守護祖靈的居所而戰。』這句話，是台灣最直截了當的環境正義宣言，也是台東這片土地上最沉重的現代史。"]}

/* ────── CHONGQING 重慶 ────── */

{ year:1938, title:"國民政府遷都重慶，戰時陪都",
summary:"南京淪陷後，蔣介石將首都遷往山城重慶，重慶成為抗日戰爭最重要的後方基地。",
story:[
"1937年底，日軍攻入南京，國民政府隨即宣布遷都武漢，再遷重慶。重慶成為「陪都」，是中國抗戰的精神堡壘。",
"日本空軍對重慶實施了長達五年半的「無差別轟炸」（1938-1944），共出動飛機九千餘架次，投彈超過兩萬噸。在那些日夜不斷的轟炸中，重慶人鑽進了山中挖掘的岩洞防空壕，頑強地活了下去。",
"然而正是這種山地地形讓重慶能夠堅守：長江、嘉陵江形成的天然屏障，加上四川盆地周邊的崇山峻嶺，讓日軍的地面部隊無從推進。",

"抗戰期間，大量工廠、大學、文化機構從東部沿海內遷重慶，在戰火中保留了中國現代工業和高等教育的火種，為戰後的重建保存了關鍵的人才和設備。",
"今天重慶的千廝門大橋下方，仍有當年的防空洞改建成的酒吧和餐廳。那些洞壁上的石頭，曾在日本炸彈的震波下顫抖了五年。",
]},
{year:1891,title:"重慶開埠：長江上游的第一個條約口岸",summary:"清廷被迫將重慶開放為通商口岸，英國和日本商人湧入，重慶從封閉的內陸城市快速蛻變為近代工商業重鎮。",story:["1876年中英《煙台條約》規定重慶對外開放，但英國商人實際抵達並建立領事館是在1891年。從此，一批批外輪沿長江三峽逆流而上，將棉織品、煤油、機械帶入川盆地腹地。","重慶的開埠打破了四川盆地兩千年的封閉格局。帆船時代，物資進出四川依賴纖夫拉縴，在三峽激流中耗費數週；蒸汽輪船的出現讓宜昌到重慶的運輸時間縮短至三五天，成本大幅降低。","英國領事館、怡和洋行、法國天主教堂先後在重慶建立，南岸和朝天門碼頭附近形成外國人租界，川劇班子、茶館和外國電影院在租界邊緣並列，是近代中國東西文化衝突最具體的縮影。","重慶開埠同時衝擊了傳統的鹽業壟斷和絲綢貿易，大批四川鹽商和絲商或破產或轉型，工業資本主義的嫩芽從三峽的岩石縫隙中緩慢萌出。","1937年抗戰爆發後，國民政府遷都重慶，那三十年的條約口岸歷史成為最關鍵的基礎設施積累——有了開埠時期建立的港口、電報線路和商業網絡，重慶才能在六年間容納下整個中國的工業和政府。"]}
,{year:1944,title:"重慶大轟炸：日軍對戰時陪都的五年空中恐怖",summary:"日本對重慶持續五年的戰略轟炸造成數萬平民死亡，但未能動搖抗戰意志，成為人類歷史上最早的城市戰略轟炸之一。",story:["1938年起，在中國空軍和有限防空火力無法抵禦的情況下，日本海軍航空兵對遷都重慶後的國民政府展開系統性戰略轟炸，目標是摧毀抗戰意志、迫使中國投降，這比德國閃電戰轟炸倫敦還早了兩年。","重慶的地形是一把雙刃劍：四面環山讓城市難以疏散，一旦日機突破防線即可在市區上空從容投彈；但山城多霧的氣候讓全年有將近半年時間雲霧遮蔽，提供了天然防護。","1941年六月五日，日機對重慶發動最慘烈的一次空襲，大批市民躲入防空洞中窒息而死，史稱「較場口大隧道慘案」，死亡人數估計逾千人，是二戰期間最嚴重的民防設施事故之一。","整個抗戰期間，重慶共遭日機轟炸二百一十八次，投彈超過兩萬噸，城區大半化為廢墟，但國民政府始終未遷都，未談和，蔣介石的堅守在客觀上激勵了盟國對中國繼續抗戰的信心。","重慶大轟炸是人類城市戰略轟炸史的早期案例，它的經驗教訓深刻影響了二戰各交戰國的空軍戰略思想。今天重慶的防空洞已改建為商業空間，在山城潮濕的地下，每一個火鍋餐廳的地基，都可能是一段轟炸歲月的最後痕跡。"]}

{ year:1911, title:"武昌起義，辛亥革命的第一槍",
summary:"清朝新軍在武昌打響了推翻帝制的第一槍，短短六週，全國十五省相繼宣布獨立。",
story:[
"1911年10月10日（農曆重陽節後一天），在武昌新軍工程第八營，士兵熊秉坤和金兆龍因為革命黨人名冊被意外發現，為了不坐以待斃，倉促舉兵起義。",

"武昌起義結束了中國兩千一百三十二年的帝制，但它開啟的「民國時代」並非立刻帶來了穩定：接下來的三十八年，中國陷入了軍閥割據、日本侵略和國共內戰的長期動盪。",
"今天武漢的首義廣場上有一座「孫中山像」，但更重要的紀念地是「起義門」——那道被革命黨人炸開的舊城牆城門，清靜地矗立在武昌的老城區，沒有太多遊客注意它。",

{year:1938,title:"武漢保衛戰：中國抗戰史上最大規模的正面決戰",summary:"中日兩軍在武漢投入逾百萬兵力激戰四個半月，中國以空間換時間，為遷移工業和持久抗戰贏得寶貴的喘息機會。",story:["1938年六月，日軍從多個方向夾擊武漢，中國最高統帥部將武漢保衛戰定位為『持久消耗』，不求守住武漢，而求盡可能拖延日軍推進速度，以換取工廠西遷的時間。","蔣介石調集一百一十個師約一百萬人防守武漢，日軍投入約三十五萬人進攻，雙方在長江南北兩岸的廣大地域激戰，萬家嶺戰役中中國軍隊幾乎全殲日軍一個師團，是抗戰前期最輝煌的勝利之一。","中國空軍和蘇聯志願航空隊在武漢上空與日本海軍航空兵展開激烈空戰，蘇聯飛行員的犧牲讓武漢保衛戰具有了國際反法西斯的色彩——他們的墓碑今天仍在武漢。","十月二十五日，國民政府宣布放棄武漢，日軍翌日佔城。四個半月的抵抗讓日本原計劃三個月結束戰爭的圖謀徹底落空，中國大批工廠、機器設備、黃金儲備和文物檔案已安全撤往重慶。","武漢保衛戰是抗戰從戰略防禦轉入戰略相持的轉折點。從此，中日戰爭進入長達六年的僵持，日本陷入了它永遠無法走出的中國泥淖，直到1945年廣島的那朵蘑菇雲終於為這一切畫上句號。"]},
{year:2019,title:"武漢：新冠肺炎疫情的起點，21世紀最重大的公共衛生事件",summary:"2019年底武漢出現不明原因肺炎，隨後蔓延全球，造成數百萬人死亡，徹底改變了21世紀的世界秩序。",story:["2019年十二月，武漢華南海鮮市場附近出現多起不明原因肺炎病例，武漢市衛生健康委員會在2019年12月31日首次公開通報，醫生李文亮因向同事示警而遭警察傳喚訓誡，成為這場疫情中最令人扼腕的象徵之一。","2020年一月二十三日，武漢宣布封城——一個一千一百萬人口的城市，歷史上第一次以如此規模被切斷對外聯繫。這個決定震驚全球，隨後被各國效仿，催生了21世紀最大規模的人口管控實驗。","新冠病毒的起源至今仍是科學與政治爭議的焦點：是源自野生動物的自然溢出，還是武漢病毒研究所的實驗室意外？世界衛生組織的調查受到重重阻礙，真相可能永遠無法完全釐清。","疫情在兩個月內蔓延至全球，最終造成超過七百萬人死亡（官方數字），部分流行病學家估計超額死亡可能高達一千五百萬至兩千萬人。全球供應鏈、工作模式、地緣政治格局，都因為這個在武漢開始的病毒而發生了不可逆的改變。","武漢在封城解除後的復甦速度讓外界震驚，但那七十六天封城的創傷留在了每個經歷者心中。疫情讓武漢這個名字永遠與21世紀最重大的公共衛生事件連結在一起，就像1918年的西班牙流感、1986年的車諾比一樣，成為人類歷史課本中不可迴避的地名。"]}

{ year:1898, title:"中東鐵路建設與哈爾濱的誕生",
summary:"俄羅斯為了搶先佔據滿洲而修建中東鐵路，哈爾濱因此從漁村變成了異國風情的「東方莫斯科」。",
story:[
"1898年，為了在日本搶佔朝鮮半島之前牢牢控制中國東北，俄羅斯開始修建「中東鐵路」——一條穿越滿洲腹地、將西伯利亞鐵路直接連接到海參崴的捷徑。",
"鐵路的施工總部設在松花江南岸的一個小村莊，大批俄國工程師、技工和士兵湧入，哈爾濱就這樣在兩三年內從零開始冒出了一座城市。",
"俄羅斯人把這裡建得像一個小莫斯科：東正教大教堂、巴洛克式建築、俄文街道名稱、圓頂的洋葱式穹頂——這在寒冷的中國東北顯得格外突兀而迷人。",
"1917年俄國革命後，大批白俄貴族和知識份子逃亡哈爾濱，把這裡一度變成俄羅斯流亡者最大的聚居地，也帶來了歌劇院、咖啡館和俄羅斯文學的沙龍氛圍。",
"1931年日本佔領東北後，大部分俄羅斯人相繼離開，哈爾濱才逐漸「中國化」，但那些歐式建築留了下來，成為城市最獨特的歷史印記。",
"今天哈爾濱的中央大街，是一條長達1.4公里、全用方塊石鋪就的步行街，兩側的歐式建築讓它看起來更像布拉格而非中國東北——一百二十年前的鐵路工地，創造了一座讓人迷失時代感的城市。",
]},
{year:1932,title:"哈爾濱淪陷與偽滿洲國：流亡者之城的終結",summary:"日本佔領哈爾濱，建立偽滿洲國，數萬俄羅斯白俄流亡者和中國抵抗者面臨命運的急遽逆轉。",story:["1932年二月，日本關東軍佔領哈爾濱，結束了這座城市短暫的現代都會繁榮期。哈爾濱原本是中東鐵路建設帶來的多元城市，俄羅斯人、猶太人、波蘭人、中國人共存，街頭同時流通四種語言。","日本佔領後，哈爾濱的俄羅斯白俄社群（沙俄滅亡後的流亡者）陷入困境——他們既不被蘇聯承認為本國公民，也不受日本保護。部分人向日軍情報機構靠攏以求庇護，另一部分則加入抗日游擊隊。","哈爾濱的猶太人社群在1930年代達到約兩萬人，是遠東最大的猶太社區之一。日本佔領後，受德日同盟影響，哈爾濱的猶太人面臨被驅逐和勒索，大批移往上海或美洲，哈爾濱的猶太文明就此凋零。","中國抗日義勇軍在哈爾濱郊區持續作戰，趙尚志率領的東北抗日聯軍在零下四五十度的嚴冬中與日軍周旋，成為東北抗日精神的象徵；他們在哈爾濱附近的犧牲，被中共官方史學奉為民族英雄敘事的核心。","今天哈爾濱的中央大街仍保存著一棟棟俄羅斯風格的巴洛克式建築，夏天的婚紗攝影和冬天的冰燈節在這裡共存。遊客在美食和美景中，很少停下來想像：這條街在某個年代同時說著俄語、意第緒語和日語，而那些語言的主人後來都以不同方式消失了。"]},
{year:1936,title:"七三一部隊：哈爾濱郊外的人體實驗噩夢",summary:"日本關東軍在哈爾濱平房區設立秘密生物戰研究基地，對中國、蘇聯、韓國戰俘進行慘無人道的活體實驗，造成至少三千人死亡。",story:["1936年，石井四郎中將在哈爾濱市郊平房區秘密建立了『關東軍防疫給水部』，對外偽稱木材加工廠，實際上是世界上規模最大的生物戰研究機構——七三一部隊。","七三一部隊以活體人類進行細菌、病毒、化學武器和外科手術實驗：研究鼠疫、霍亂、炭疽、梅毒的傳播方式，測試凍傷的臨界條件，在不使用麻醉的情況下活體摘除器官。受害者被稱為『丸太』（木材），以維持偽裝身份。","估計有三千至一萬人在七三一部隊的實驗中死亡，受害者包括中國人、蘇聯人、韓國人、蒙古人及少數美國戰俘。這是繼納粹德國集中營之後，二戰期間規模最大的國家主導人體實驗。","1945年蘇聯宣戰前，七三一部隊緊急銷毀實驗記錄，撤離人員，並殺害了剩餘的被實驗者以滅口。石井四郎戰後被美國以提供研究數據為交換條件免於起訴，從未受到法律制裁，直到1959年以自然死亡告終。","今天七三一遺址博物館在哈爾濱平房區對公眾開放，白色的實驗台和鐵柵欄令每個參觀者沉默。這個地方提醒著人們：科學可以是解放，也可以是暴行的工具——差別只在於一個人心中有沒有把他人當人看。"]}

{ year:1625, title:"努爾哈赤定都盛京，清朝的搖籃",
summary:"後金（清朝前身）的創建者努爾哈赤將首都從遼陽遷至盛京（今瀋陽），清帝國在此奠基。",
story:[
"1625年，統一女真各部的努爾哈赤做出了一個改變中國命運的決定：將後金的首都從遼陽遷到瀋陽，並將其命名為「盛京」。",

"今天瀋陽故宮和清福陵（努爾哈赤陵）是世界文化遺產，那些紅牆黃瓦下，埋藏著一個遊牧民族如何從苦寒之地出發，征服了世界上人口最多的農業帝國的宏大故事。",

{ year:1931, title:"九一八事變：日本侵佔東北的第一步",

story:[

"日本在東北建立了「滿洲國」傀儡政權，末代皇帝溥儀被扶上了名義上的寶座。日本資本大量湧入，在東北建立了以重工業為基礎的「大陸基地」。",
"九一八事變的日期——九月十八日——至今仍是中國最重要的國恥紀念日。每年這一天，瀋陽全市會在晚上九時十八分拉響防空警報，持續整整十八分鐘。",
"今天的九一八歷史博物館的外形是一座巨大的日曆石雕，指向「9月18日」這個永恆停止的日子——在這裡，時間被刻意凍結，讓每一個來訪者無法逃避那個夜晚的質問。",

{year:1948,title:"遼瀋戰役：解放軍攻克瀋陽，東北全境易主",summary:"中共在五十二天內殲滅國軍四十七萬人，完整奪取東北工業基地，為解放戰爭的最終勝利奠定決定性基礎。",story:["1948年九月，中共東北野戰軍在林彪指揮下，以百萬兵力對國軍展開遼瀋戰役，戰略核心是先切斷錦州，封堵東北國軍的退路，再各個殲滅。","錦州攻陷後，困守長春的國軍第六十軍臨陣倒戈，長春和平解放，困守已久的國軍和平民在歷時五個多月的圍城後終於獲得出路，但長達一百五十天的圍城中已有大量平民餓死。","瀋陽是東北最大的工業城市，也是東北剿總司令衛立煌的大本營。十一月一日，解放軍發起瀋陽總攻，城內部分國軍指揮官在解放軍攻城前已祕密接受投誠，衛立煌倉皇出逃，瀋陽在不到三十小時內完全落入解放軍之手。","遼瀋戰役的意義在於它的速度和規模——五十二天全殲四十七萬人，解放軍以極小代價奪取了整個東北，繳獲了大量日本留下的工業設備和武器物資，為後來的平津戰役和渡江戰役提供了強大的後盾。","今天瀋陽的中央地位來自遼瀋戰役後的政治地理重組：作為東北解放的象徵城市，瀋陽在新中國建立初期獲得大量工業投資，成為共和國工業體系的重要支柱。九一八歷史博物館和遼瀋戰役紀念館並列於城市地標，共同訴說著這座城市在20世紀如何兩次成為東北命運的轉折點。"]}

story:[
